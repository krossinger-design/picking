<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>이천창고 WMS — 관리</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap">
<style>
:root{
  --ground:#EEF0EC; --surface:#FFFFFF; --surface-2:#F5F6F3; --ink:#15181B; --ink-2:#4A5057; --ink-3:#7A8189;
  --line:#D5D9D2; --plate:#F4C21B; --btn-bg:#15181B; --btn-fg:#FFFFFF;
  --ok:#1E7D45; --ok-bg:#E1F2E7; --warn:#B65E0C; --warn-bg:#FBEBD8; --bad:#BD3528; --bad-bg:#F8E1DD;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace; --r:10px;
  --shadow:0 1px 2px rgba(21,24,27,.06),0 6px 20px rgba(21,24,27,.05);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --ground:#111315; --surface:#1A1D20; --surface-2:#22262A; --ink:#ECEEEA; --ink-2:#B3B9B2; --ink-3:#858C86;
  --line:#2F3438; --btn-bg:#ECEEEA; --btn-fg:#111315;
  --ok:#56C584; --ok-bg:#15301F; --warn:#F0A04B; --warn-bg:#382813; --bad:#F27A6B; --bad-bg:#3B1B18;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);}}
:root[data-theme="dark"]{--ground:#111315; --surface:#1A1D20; --surface-2:#22262A; --ink:#ECEEEA; --ink-2:#B3B9B2; --ink-3:#858C86;
  --line:#2F3438; --btn-bg:#ECEEEA; --btn-fg:#111315; --ok:#56C584; --ok-bg:#15301F; --warn:#F0A04B; --warn-bg:#382813; --bad:#F27A6B; --bad-bg:#3B1B18;}
*{box-sizing:border-box}[hidden]{display:none!important}
html,body{background:var(--ground)}
body{margin:0;color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}button{cursor:pointer}
:focus-visible{outline:3px solid var(--plate);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--ink-3)}
.top{position:sticky;top:0;z-index:20;background:var(--ground);border-bottom:1px solid var(--line);padding:10px 20px;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;font-size:16px;margin-right:auto}
.brand i{width:20px;height:20px;border-radius:4px;background:repeating-linear-gradient(-45deg,var(--plate) 0 5px,#15181B 5px 10px)}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;padding:5px 11px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink-2)}
.pill .dot{width:7px;height:7px;border-radius:50%;background:var(--ink-3)}
.pill.live .dot{background:var(--ok)}
.wrap{max-width:1500px;margin:0 auto;padding:16px 20px 60px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.tab{min-height:38px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink-2);font-size:14px}
.tab[aria-pressed="true"]{background:var(--btn-bg);border-color:var(--btn-bg);color:var(--btn-fg);font-weight:700}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:38px;padding:0 14px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);font-weight:500;text-decoration:none;color:inherit}
.btn.primary{background:var(--btn-bg);color:var(--btn-fg);border-color:var(--btn-bg);font-weight:700}
.btn.small{min-height:32px;padding:0 10px;font-size:13px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:16px;margin-bottom:14px}
.card h2{margin:0 0 10px;font-size:16px;letter-spacing:-.01em}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.kpi b{display:block;font-family:var(--f-mono);font-size:26px;line-height:1.1}
.kpi span{font-size:12.5px;color:var(--ink-3)}
.kpi.hot b{color:var(--bad)} .kpi.warn b{color:var(--warn)} .kpi.ok b{color:var(--ok)}
.search{min-height:38px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface-2);padding:0 12px;min-width:240px}
.tbl-wrap{overflow:auto;max-height:70vh;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table.tbl{border-collapse:separate;border-spacing:0;width:100%;font-size:13px}
.tbl th,.tbl td{border-bottom:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top;white-space:nowrap}
.tbl th{position:sticky;top:0;background:var(--surface-2);font-size:12px;color:var(--ink-3);font-weight:700;letter-spacing:.03em;z-index:1;cursor:pointer;user-select:none}
.tbl th.no{cursor:default}
.tbl tbody tr:hover{background:var(--surface-2)}
.tbl td.wrap{white-space:normal;min-width:220px}
.tbl td.num{text-align:right;font-family:var(--f-mono)}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:700;padding:2px 7px;border-radius:5px;white-space:nowrap}
.chip.ok{background:var(--ok-bg);color:var(--ok)} .chip.warn{background:var(--warn-bg);color:var(--warn)}
.chip.bad{background:var(--bad-bg);color:var(--bad)} .chip.n{background:var(--surface-2);color:var(--ink-2)}
.chip.hot{background:var(--bad);color:#fff}
.bar{height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden;display:flex;min-width:70px}
.bar i{display:block;height:100%} .bar .d{background:var(--ok)} .bar .s{background:var(--warn)}
.empty{padding:30px;text-align:center;color:var(--ink-3)}
.link{color:inherit;text-decoration:underline;text-underline-offset:3px;cursor:pointer;background:none;border:0;padding:0;font:inherit;text-align:left}
.sub{font-size:12px;color:var(--ink-3)}
.banner{padding:11px 14px;border-radius:var(--r);font-size:13.5px;margin-bottom:12px}
.banner.bad{background:var(--bad-bg);color:var(--bad)}
.banner.warn{background:var(--warn-bg);color:var(--warn)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(420px,1fr));gap:14px}
dialog{border:0;border-radius:14px;padding:0;max-width:560px;width:calc(100% - 32px);background:var(--surface);color:var(--ink);box-shadow:0 20px 60px rgba(0,0,0,.35)}
dialog::backdrop{background:rgba(10,12,14,.5)}
.dlg{padding:20px;display:flex;flex-direction:column;gap:12px}
.dlg h3{margin:0;font-size:18px}
</style>
</head>
<body>
<header class="top">
  <div class="brand"><i aria-hidden="true"></i><span>이천창고 WMS — 관리</span></div>
  <span class="pill" id="stamp"></span>
  <button class="pill" id="conn" type="button"><span class="dot"></span><span id="connText">연결 확인 중</span></button>
  <button class="btn small" id="reload" type="button">새로고침</button>
</header>

<main class="wrap">
  <div id="warn"></div>
  <div class="kpis" id="kpis"></div>
  <nav class="tabs" role="group" aria-label="화면">
    <button class="tab" type="button" data-v="stock" aria-pressed="true">재고 현황</button>
    <button class="tab" type="button" data-v="trace" aria-pressed="false">품목 추적</button>
    <button class="tab" type="button" data-v="slips" aria-pressed="false">전표 · 작업</button>
    <button class="tab" type="button" data-v="flow" aria-pressed="false">입고 · 보류 · 패킹</button>
    <button class="tab" type="button" data-v="moves" aria-pressed="false">움직임 장부</button>
    <button class="tab" type="button" data-v="issues" aria-pressed="false">안 맞는 것</button>
  </nav>
  <section id="view"></section>
</main>

<dialog id="dlg"><div class="dlg" id="dlgBody"></div></dialog>

<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script>
/* 구글 시트 웹 앱 주소. 비워 두면 링크의 ?api=주소 로 한 번 받아 이 PC에 기억해요. */
const OPK_API_URL = '';
(() => {
'use strict';
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const coll = new Intl.Collator('ko', {numeric:true, sensitivity:'base'});
const num = v => v === '' || v === null || v === undefined ? '' : Number(v).toLocaleString();
const LS = { get(k, d){ try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch(e){ return d; } },
             set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} } };
const okApi = u => typeof u === 'string' && (/^https:\/\/script\.google(usercontent)?\.com\//.test(u) || /^\/[^/]/.test(u));
let API = OPK_API_URL;
try { const q = new URLSearchParams(location.search).get('api');
  if (q && okApi(q)) { LS.set('opk.api', q); history.replaceState(null, '', location.pathname); }
  if (!API) API = LS.get('opk.api', '');
} catch(e){}

async function call(action, data){
  if (!API) throw new Error('주소 없음');
  const r = await fetch(API, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify({action, data: data || {}})});
  const j = await r.json();
  if (!j.ok) throw new Error(j.message || '요청 실패');
  return j.result;
}
function dialog(title, html, actions){
  const d = $('#dlg');
  $('#dlgBody').innerHTML = `<h3>${esc(title)}</h3>${html}<div class="row" style="justify-content:flex-end">${(actions || [['닫기','']]).map((a, i) => `<button class="btn ${i === 0 ? 'primary' : ''}" type="button" data-i="${i}">${esc(a[0])}</button>`).join('')}</div>`;
  $('#dlgBody').querySelectorAll('[data-i]').forEach(b => b.onclick = () => { const a = (actions || [['닫기','']])[+b.dataset.i]; d.close(); if (typeof a[1] === 'function') a[1](); });
  d.showModal();
}
function sheet(name, aoa, cols){
  const ws = XLSX.utils.aoa_to_sheet(aoa);
  if (cols) ws['!cols'] = cols.map(w => ({wch:w}));
  return [name, ws];
}
function save(fname, sheets){
  const wb = XLSX.utils.book_new();
  sheets.forEach(([n, ws]) => XLSX.utils.book_append_sheet(wb, ws, n));
  const buf = XLSX.write(wb, {bookType:'xlsx', type:'array'});
  const url = URL.createObjectURL(new Blob([buf], {type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}));
  const a = document.createElement('a'); a.href = url; a.download = fname; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 4000);
}
const today = () => { const d = new Date(); return `${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}`; };

/* ---------- 상태 ---------- */
const S = { view: 'stock', info: null, busy: false,
  stock: null, stockQ: '', stockSort: ['code', 1], stockTotal: 0,
  trace: null, traceQ: '', traceFound: null,
  slips: null, slipSort: ['at', -1], slipF: 'all',
  issues: null, issueTab: 'diffs',
  mv: null, mvQ: '', mvKind: '', mvAsOf: '', mvCheck: null,
  flow: null, flowTab: 'inbs', invQ: '' };

function setConn(ok, text){
  $('#conn').classList.toggle('live', !!ok);
  $('#connText').textContent = text;
}
function sortBy(arr, key, dir){
  return arr.slice().sort((a, b) => {
    const x = a[key], y = b[key];
    if (typeof x === 'number' && typeof y === 'number') return (x - y) * dir;
    return coll.compare(String(x ?? ''), String(y ?? '')) * dir;
  });
}
function th(label, key, cur, onSort, cls){
  const on = cur[0] === key;
  return `<th class="${cls || ''}${key ? '' : ' no'}" ${key ? `data-sort="${key}"` : ''}>${esc(label)}${on ? (cur[1] > 0 ? ' ▲' : ' ▼') : ''}</th>`;
}

/* ---------- 머리 ---------- */
function renderTop(){
  const i = S.info || {};
  const pend = (i.locNew || 0) + (i.countNew || 0);
  $('#stamp').textContent = i.at ? `재고 기준 ${i.at}${i.wh ? ' · ' + i.wh : ''}` : '재고 파일 없음';
  $('#kpis').innerHTML = `
    <div class="kpi"><b>${num(i.n || 0)}</b><span>등록 품목</span></div>
    <div class="kpi"><b>${num(i.binRows || 0)}</b><span>자리별 재고 줄</span></div>
    <div class="kpi ${i.cartons ? 'warn' : ''}"><b>${num(i.cartons || 0)}</b><span>담겨 있는 박스</span></div>
    <div class="kpi ${pend ? 'hot' : 'ok'}"><b>${num(pend)}</b><span>이카운트 미전송</span></div>
    <div class="kpi"><b>${num(i.sets || 0)}</b><span>세트 품목</span></div>`;
}

/* ---------- 재고 현황 ---------- */
async function loadStock(){
  S.busy = true; render();
  try { const r = await call('wmsStock', {q: S.stockQ, limit: 500}); S.stock = r.rows; S.stockTotal = r.total; }
  catch(e){ S.stock = []; dialog('불러오지 못했어요', `<p>${esc(e.message)}</p>`); }
  S.busy = false; render();
}
function viewStock(){
  const rows = S.stock;
  const sorted = rows ? sortBy(rows, S.stockSort[0], S.stockSort[1]) : [];
  return `<div class="card">
    <div class="row" style="margin-bottom:10px">
      <input class="search" id="sq" type="search" placeholder="품목명 · 품목코드 · 바코드 · 자리" value="${esc(S.stockQ)}">
      <button class="btn primary" id="sgo" type="button">찾기</button>
      <button class="btn" id="sxls" type="button" ${rows && rows.length ? '' : 'disabled'}>엑셀로 받기</button>
      <span class="sub">${rows ? `${num(sorted.length)}건 표시 / 전체 ${num(S.stockTotal)}건${S.stockTotal > sorted.length ? ' — 검색어를 좁히면 더 정확해요' : ''}` : ''}</span>
    </div>
    ${S.busy ? '<p class="muted">불러오는 중…</p>' : ''}
    ${rows ? (sorted.length ? `<div class="tbl-wrap"><table class="tbl"><thead><tr>
        ${th('품목코드','code',S.stockSort)}${th('품목명','name',S.stockSort)}${th('바코드','bc',S.stockSort)}
        ${th('규격','spec',S.stockSort)}${th('이카운트 재고','stk',S.stockSort,0,'num')}${th('자리 합계','binQty',S.stockSort,0,'num')}
        ${th('보류','holdQty',S.stockSort,0,'num')}${th('차이','gap',S.stockSort,0,'num')}${th('자리별 수량','',S.stockSort)}${th('','' ,S.stockSort)}</tr></thead><tbody>
        ${sorted.map(r => `<tr>
          <td class="mono">${esc(r.code)}</td>
          <td class="wrap">${esc(r.name)}</td>
          <td class="mono muted">${esc(r.bc || '-')}</td>
          <td class="muted">${esc([r.spec, r.size].filter(Boolean).join(' · ') || '-')}</td>
          <td class="num">${num(r.stk)}</td>
          <td class="num">${r.holdQty ? `<span class="chip warn">${num(r.holdQty)}</span>` : ''}</td>
          <td class="num">${r.gap === '' ? '' : (r.gap === 0 ? '<span class="chip ok">맞음</span>' : `<span class="chip ${r.gap < 0 ? 'bad' : 'warn'}">${r.gap > 0 ? '+' : ''}${r.gap}</span>`)}</td>
          <td class="wrap mono">${r.bins.length ? r.bins.map(b => `${esc(b[0])} <b>${b[1]}</b>`).join(' · ') : '<span class="chip bad">자리 없음</span>'}</td>
          <td><button class="btn small" data-trace="${esc(r.code)}" type="button">추적</button></td>
        </tr>`).join('')}</tbody></table></div>` : '<div class="empty">찾는 품목이 없어요.</div>') : '<div class="empty">검색어를 넣고 <b>찾기</b>를 누르세요. 비워 두고 누르면 전체를 봅니다.</div>'}
  </div>`;
}
function stockXls(){
  const rows = sortBy(S.stock, S.stockSort[0], S.stockSort[1]);
  const a1 = [['품목코드','품목명','바코드','규격','사이즈','이카운트 재고','자리 합계','보류','차이','대표 자리','자리별 수량']];
  rows.forEach(r => a1.push([r.code, r.name, r.bc, r.spec, r.size, r.stk, r.binQty, r.holdQty || 0, r.gap, r.loc,
    r.bins.map(b => `${b[0]} ${b[1]}`).join(' / ')]));
  const a2 = [['품목코드','품목명','자리','수량']];
  rows.forEach(r => r.bins.forEach(b => a2.push([r.code, r.name, b[0], b[1]])));
  save(`재고현황_${today()}.xlsx`, [sheet('재고현황', a1, [20,40,16,14,14,12,12,8,8,16,40]), sheet('자리별', a2, [20,40,16,10])]);
}

/* ---------- 품목 추적 ---------- */
async function traceFind(q){
  S.busy = true; S.traceFound = null; render();
  try { const r = await call('wmsStock', {q, limit: 30}); S.traceFound = r.rows; }
  catch(e){ S.traceFound = []; }
  S.busy = false;
  if (S.traceFound && S.traceFound.length === 1) return traceLoad(S.traceFound[0].code, S.traceFound[0].name);
  render();
}
async function traceLoad(code, name){
  S.busy = true; render();
  try { const r = await call('wmsTrace', {code}); S.trace = {...r, name: name || (S.traceFound || []).find(x => x.code === code)?.name || ''}; S.view = 'trace'; }
  catch(e){ dialog('불러오지 못했어요', `<p>${esc(e.message)}</p>`); }
  S.busy = false; render();
}
function viewTrace(){
  const t = S.trace;
  return `<div class="card">
    <div class="row" style="margin-bottom:10px">
      <input class="search" id="tq" type="search" placeholder="품목명 · 품목코드 · 바코드" value="${esc(S.traceQ)}">
      <button class="btn primary" id="tgo" type="button">찾기</button>
      ${t ? `<button class="btn" id="txls" type="button">엑셀로 받기</button>` : ''}
    </div>
    ${S.busy ? '<p class="muted">불러오는 중…</p>' : ''}
    ${S.traceFound ? (S.traceFound.length ? `<div class="tbl-wrap" style="max-height:30vh"><table class="tbl"><tbody>
      ${S.traceFound.map(r => `<tr><td class="mono">${esc(r.code)}</td><td class="wrap">${esc(r.name)}</td><td class="num">${num(r.stk)}</td>
        <td><button class="btn small" data-trace="${esc(r.code)}" type="button">이력 보기</button></td></tr>`).join('')}
      </tbody></table></div>` : '<div class="empty">찾는 품목이 없어요.</div>') : ''}
    ${t ? `<div style="margin-top:12px">
      <h2>${esc(t.name || t.code)} <span class="mono muted" style="font-weight:400">${esc(t.code)}</span></h2>
      <div class="row" style="margin-bottom:10px">
        <span class="chip n">이카운트 재고 ${num(t.stk)}</span>
        <span class="chip ${t.binQty === t.stk ? 'ok' : 'warn'}">자리 합계 ${num(t.binQty)}</span>
        ${t.bins.map(b => `<span class="chip n mono">${esc(b[0])} ${b[1]}</span>`).join('')}
      </div>
      ${t.rows.length ? `<div class="tbl-wrap"><table class="tbl"><thead><tr>
        <th class="no">시각</th><th class="no">무슨 일</th><th class="no">어디서</th><th class="no">어디로</th><th class="no">수량</th><th class="no">작업자</th><th class="no">근거</th></tr></thead><tbody>
        ${t.rows.map(r => `<tr>
          <td class="mono">${esc(r.at)}</td>
          <td><span class="chip ${/부족/.test(r.kind) ? 'bad' : /실사/.test(r.kind) ? 'warn' : /피킹/.test(r.kind) ? 'n' : 'ok'}">${esc(r.kind)}</span></td>
          <td class="mono">${esc(r.from || '-')}</td>
          <td class="mono">${esc(r.to || '-')}</td>
          <td class="num">${r.kind === '실사' ? `${r.was} → ${r.now} (${r.gap > 0 ? '+' : ''}${r.qty})` : num(r.qty)}${r.want ? ` / ${r.want}` : ''}</td>

        <td>${esc(x.name)}</td><td class="n">${num(x.qty)}</td><td>${esc(x.judge)}</td><td>${esc(x.why)}</td>
        <td class="mono">${esc(x.loc)}</td><td class="mono">${esc(x.at)}</td></tr>`).join('')}
    </tbody></table></div>` : '<p class="muted">아직 반품 기록이 없어요.</p>'}</div>`;
}
function flowXls(){
  const F = S.flow; if (!F) return;
  const a1 = [['입고번호','거래처','입고창고','예정일','품목수','검수완료','차이','상태','작업자','올린시각','완료시각']];
  F.inbs.forEach(x => a1.push([x.no, x.vendor, x.wh, x.eta, x.n, x.done, x.gap, x.status, x.worker, x.at, x.end]));
  const a2 = [['구역','자리','품목코드','품목명','수량']];
  F.hold.forEach(x => a2.push([HOLDNM[x.area] || x.area, x.loc, x.code, x.name, x.qty]));
  const a3 = [['전표번호','입고처','상태','줄','담은 박스','송장','아직 안 쌈','작업자']];
  F.packs.forEach(x => a3.push([x.no, x.to, x.status, x.n, x.boxes, x.invoices, x.wait, x.worker]));
  const a4 = [['반품번호','구분','상대처','품목코드','품목명','수량','판정','사유','자리','접수','처리']];
  F.rets.forEach(x => a4.push([x.no, x.kind, x.who, x.code, x.name, x.qty, x.judge, x.why, x.loc, x.at, x.done]));
  save(`입고_보류_패킹_${today()}.xlsx`, [sheet('입고', a1, [16,18,14,12,8,9,7,11,10,17,17]),
    sheet('보류재고', a2, [12,18,20,40,9]), sheet('패킹', a3, [16,18,10,7,11,8,11,10]),
    sheet('반품', a4, [16,12,16,20,36,8,8,14,18,17,17])]);
}
/* ---------- 움직임 장부 ----------
   재고가 바뀐 모든 일이 번호 순으로 쌓여 있어요. 지우지 않고 되돌리기도 반대 줄로 남아요.
   그래서 '그때 그 자리에 몇 개였나' 를 언제든 되살려 볼 수 있어요. */
const KINDS = ['초기화','이동','자리지정','피킹출고','피킹취소','카톤담기','카톤내리기','카톤되돌리기','실사조정'];
async function loadMoves(){
  S.busy = true; render();
  try {
    if (S.mvAsOf) {
      const r = await call('stockAsOf', {at: S.mvAsOf});
      S.mv = {asOf: r.rows || [], until: r.until};
    } else {
      const r = await call('ledger', {code: S.mvQ, kind: S.mvKind, limit: 500});
      S.mv = {rows: r.rows || [], total: r.total};
    }
  } catch(e){ S.mv = {rows: []}; dialog('불러오지 못했어요', `<p>${esc(e.message)}</p>`); }
  S.busy = false; render();
}
async function runCheck(){
  S.busy = true; render();
  try { S.mvCheck = await call('selfCheck', {}); }
  catch(e){ S.mvCheck = null; dialog('점검하지 못했어요', `<p>${esc(e.message)}</p>`); }
  S.busy = false; render();
}
function viewMoves(){
  const m = S.mv, chk = S.mvCheck;
  let head = `<div class="card">
    <div class="row" style="margin-bottom:10px">
      <input class="search" id="mq" type="search" placeholder="품목코드로 좁히기" value="${esc(S.mvQ)}" style="max-width:260px">
      <select id="mkind" class="search" style="max-width:150px"><option value="">모든 종류</option>${
        KINDS.map(k => `<option value="${k}"${S.mvKind === k ? ' selected' : ''}>${k}</option>`).join('')}</select>
      <input class="search" id="masof" type="date" value="${esc(S.mvAsOf)}" style="max-width:160px" title="그 날 끝난 시점의 자리 재고를 되살려 봐요">
      <button class="btn primary" id="mgo" type="button">보기</button>
      <button class="btn" id="mclr" type="button">지우기</button>
      <button class="btn" id="mchk" type="button">숫자 맞는지 점검</button>
      <button class="btn" id="mxls" type="button" ${m ? '' : 'disabled'}>엑셀로 받기</button>
    </div>`;
  if (chk) head += chk.ok
    ? `<div class="banner ok">장부와 자리별 재고가 모두 맞아요. 장부 ${num((chk.bins||{}).rows || 0)}줄 · 시트 머리글도 정상이에요.</div>`
    : `<div class="banner bad">안 맞는 데가 있어요 —
        ${(chk.heads||[]).length ? `시트 머리글 ${(chk.heads||[]).length}곳 (${esc((chk.heads||[]).slice(0,3).map(h => h.sheet + (h.col ? ' ' + h.col + '열' : '')).join(', '))})` : ''}
        ${((chk.bins||{}).bad||[]).length ? ` 자리 수량 ${((chk.bins||{}).bad||[]).length}건 (${esc(((chk.bins||{}).bad||[]).slice(0,3).map(b => b.code + ' ' + b.loc + ' 장부 ' + b.ledger + ' / 표 ' + b.cache).join(', '))})` : ''}
        ${((chk.bins||{}).badBox||[]).length ? ` 박스 ${((chk.bins||{}).badBox||[]).length}건` : ''}
        <br>자리 수량이 안 맞으면 폰 앱 재고 관리에서 다시 채우거나, 담당자에게 ‘다시 계산’을 부탁하세요. 장부는 그대로 남아 있어요.</div>`;
  head += `</div>`;
  if (!m) return head + `<div class="card"><p class="muted">‘보기’ 를 누르면 최근 움직임이 나와요. 날짜를 넣으면 그 날 끝난 시점의 자리 재고를 되살려 봐요.</p></div>`;
  if (m.asOf) {
    const rows = m.asOf;
    return head + `<div class="card"><h3>${esc(S.mvAsOf)} 끝난 시점의 자리 재고 <span class="muted">· 장부 ${num(m.until||0)}번까지 접은 결과 · ${num(rows.length)}줄</span></h3>
      ${rows.length ? `<div class="wrap"><table><thead><tr><th>자리</th><th>품목코드</th><th>품목명</th><th class="n">수량</th></tr></thead><tbody>
        ${rows.map(r => `<tr><td class="mono">${esc(r.loc)}${r.box ? ' <span class="muted">(박스)</span>' : ''}</td><td class="mono">${esc(r.code)}</td><td>${esc(r.name)}</td><td class="n">${num(r.qty)}</td></tr>`).join('')}
      </tbody></table></div>` : '<p class="muted">그 시점에는 자리 재고가 없었어요.</p>'}</div>`;
  }
  const rows = m.rows;
  return head + `<div class="card"><h3>최근 움직임 <span class="muted">· ${num(rows.length)}줄 보임 / 전체 ${num(m.total||0)}줄</span></h3>
    ${rows.length ? `<div class="wrap"><table><thead><tr><th class="n">번호</th><th>시각</th><th>무슨 일</th><th>품목코드</th><th>품목명</th><th class="n">수량</th><th>나간 자리</th><th>들어온 자리</th><th>근거</th><th>사람</th><th>이카운트</th><th>메모</th></tr></thead><tbody>
      ${rows.map(r => `<tr><td class="n mono">${r.no}</td><td class="mono">${esc(r.at)}</td><td>${esc(r.kind)}</td>
        <td class="mono"><button class="link mono" data-trace="${esc(r.code)}" type="button">${esc(r.code)}</button></td><td>${esc(r.name)}</td>
        <td class="n">${num(r.qty)}</td><td class="mono">${esc(r.from)}</td><td class="mono">${esc(r.to)}</td>
        <td class="mono">${esc(r.ref)}</td><td>${esc(r.by)}</td><td class="mono">${esc(r.sent) || '<span class="muted">—</span>'}</td><td class="muted">${esc(r.memo)}</td></tr>`).join('')}
    </tbody></table></div>` : '<p class="muted">해당하는 움직임이 없어요.</p>'}</div>`;
}
function moveXls(){
  const m = S.mv; if (!m) return;
  if (m.asOf) {
    const a = [['자리','품목코드','품목명','수량','박스에 담긴 것']];
    m.asOf.forEach(r => a.push([r.loc, r.code, r.name, r.qty, r.box ? 'O' : '']));
    save(`시점재고_${S.mvAsOf.replace(/-/g,'')}.xlsx`, [sheet('시점재고', a, [16,20,40,10,14])]);
    return;
  }
  const a = [['번호','시각','무슨 일','품목코드','품목명','수량','나간 자리','들어온 자리','근거','사람','이카운트 보낸시각','메모']];
  m.rows.forEach(r => a.push([r.no, r.at, r.kind, r.code, r.name, r.qty, r.from, r.to, r.ref, r.by, r.sent, r.memo]));
  save(`움직임장부_${today()}.xlsx`, [sheet('움직임', a, [8,17,14,20,40,10,14,14,18,10,17,30])]);
}
/* ---------- 그리기 ---------- */
function render(){
  renderTop();
  document.querySelectorAll('[data-v]').forEach(b => b.setAttribute('aria-pressed', S.view === b.dataset.v));
  const el = $('#view');
  el.innerHTML = S.view === 'stock' ? viewStock() : S.view === 'trace' ? viewTrace()
    : S.view === 'slips' ? viewSlips() : S.view === 'moves' ? viewMoves()
    : S.view === 'flow' ? viewFlow() : viewIssues();
  el.querySelectorAll('[data-sort]').forEach(h => h.onclick = () => {
    const key = h.dataset.sort;
    const cur = S.view === 'stock' ? S.stockSort : S.slipSort;
    const next = cur[0] === key ? [key, -cur[1]] : [key, 1];
    if (S.view === 'stock') S.stockSort = next; else S.slipSort = next;
    render();
  });
  el.querySelectorAll('[data-trace]').forEach(b => b.onclick = () => { S.view = 'trace'; S.traceFound = null; traceLoad(b.dataset.trace); });
  el.querySelectorAll('[data-sf]').forEach(b => b.onclick = () => { S.slipF = b.dataset.sf; render(); });
  el.querySelectorAll('[data-it]').forEach(b => b.onclick = () => { S.issueTab = b.dataset.it; render(); });
  const sq = $('#sq'); if (sq) { sq.oninput = () => S.stockQ = sq.value;
    sq.onkeydown = e => { if (e.key === 'Enter') { S.stockQ = sq.value; loadStock(); } }; }
  const sgo = $('#sgo'); if (sgo) sgo.onclick = () => { S.stockQ = $('#sq').value; loadStock(); };
  const sx = $('#sxls'); if (sx) sx.onclick = stockXls;
  const tq = $('#tq'); if (tq) { tq.oninput = () => S.traceQ = tq.value;
    tq.onkeydown = e => { if (e.key === 'Enter') traceFind(tq.value); }; }
  const tgo = $('#tgo'); if (tgo) tgo.onclick = () => traceFind($('#tq').value);
  const tx = $('#txls'); if (tx) tx.onclick = traceXls;
  const px = $('#pxls'); if (px) px.onclick = slipXls;
  const ix = $('#ixls'); if (ix) ix.onclick = issueXls;
  const mq = $('#mq'); if (mq) { mq.oninput = () => S.mvQ = mq.value;
    mq.onkeydown = e => { if (e.key === 'Enter') { S.mvQ = mq.value; loadMoves(); } }; }
  const mk = $('#mkind'); if (mk) mk.onchange = () => { S.mvKind = mk.value; loadMoves(); };
  const ma = $('#masof'); if (ma) ma.onchange = () => { S.mvAsOf = ma.value; };
  const mg = $('#mgo'); if (mg) mg.onclick = () => { S.mvQ = $('#mq').value; S.mvAsOf = $('#masof').value; loadMoves(); };
  const mc = $('#mclr'); if (mc) mc.onclick = () => { S.mvQ = ''; S.mvKind = ''; S.mvAsOf = ''; S.mv = null; S.mvCheck = null; render(); };
  const mh = $('#mchk'); if (mh) mh.onclick = runCheck;
  const mx = $('#mxls'); if (mx) mx.onclick = moveXls;
  el.querySelectorAll('[data-ft]').forEach(b => b.onclick = () => { S.flowTab = b.dataset.ft; S.inv = null; render(); });
  const fx = $('#fxls'); if (fx) fx.onclick = flowXls;
  const iq = $('#iq'); if (iq) { iq.oninput = () => S.invQ = iq.value;
    iq.onkeydown = e => { if (e.key === 'Enter') invFind(); }; }
  const ig = $('#igo'); if (ig) ig.onclick = invFind;
}
async function invFind(){
  const q = ($('#iq') || {}).value || S.invQ;
  if (!q || !q.trim()) return;
  S.invQ = q.trim(); S.busy = true; render();
  try { const r = await call('invoiceFind', {q: S.invQ}); S.inv = r.rows || []; }
  catch(e){ S.inv = []; }
  S.busy = false; render();
}
async function refresh(){
  if (!API) { setConn(false, '주소를 넣어 주세요'); $('#warn').innerHTML = '<div class="banner bad">구글 시트 웹 앱 주소가 없어요. 오른쪽 위 연결 단추를 눌러 넣어 주세요. 폰 앱에서 쓰는 주소와 같은 주소예요.</div>'; render(); return; }
  try {
    const r = await call('sync', {ver:'x', codesVer:'x'});
    S.info = r.stockInfo || {}; setConn(true, '구글 시트 연결'); $('#warn').innerHTML = '';
  } catch(e){ setConn(false, '연결 끊김'); $('#warn').innerHTML = `<div class="banner bad">연결하지 못했어요 — ${esc(e.message)}</div>`; }
  if (S.view === 'slips' && !S.slips) loadSlips();
  else if (S.view === 'issues' && !S.issues) loadIssues();
  else if (S.view === 'moves' && !S.mv) loadMoves();
  else if (S.view === 'flow' && !S.flow) loadFlow();
  else render();
}
document.querySelectorAll('[data-v]').forEach(b => b.onclick = () => {
  S.view = b.dataset.v;
  if (S.view === 'slips' && !S.slips) return loadSlips();
  if (S.view === 'issues' && !S.issues) return loadIssues();
  if (S.view === 'moves' && !S.mv) return loadMoves();
  if (S.view === 'flow' && !S.flow) return loadFlow();
  render();
});
$('#reload').onclick = () => { S.stock = null; S.slips = null; S.issues = null; S.trace = null; S.traceFound = null; S.mv = null; S.mvCheck = null; S.flow = null; S.inv = null; refresh(); };
$('#conn').onclick = () => {
  dialog('구글 시트 연결', `<p class="muted">폰 앱과 같은 웹 앱 주소를 넣어 주세요.</p>
    <input class="search" id="apiUrl" style="width:100%" value="${esc(API)}" placeholder="https://script.google.com/macros/s/…/exec">`,
    [['저장하고 다시 열기', () => { const v = $('#apiUrl').value.trim(); if (!okApi(v)) { dialog('주소를 확인해 주세요', '<p>https://script.google.com/ 으로 시작하는 주소를 넣어 주세요.</p>'); return; } LS.set('opk.api', v); location.reload(); }], ['취소','']]);
};
if (!window.XLSX) console.warn('XLSX 로드 실패');
refresh();
})();
</script>
</body>
</html>
