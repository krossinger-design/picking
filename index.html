<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>이천창고 오더피킹</title>
<meta name="theme-color" content="#15181B">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@500;600&family=IBM+Plex+Sans+KR:wght@400;500;700&display=swap">
<style>
:root{
  --ground:#EEF0EC; --surface:#FFFFFF; --surface-2:#F5F6F3; --ink:#15181B; --ink-2:#4A5057; --ink-3:#7A8189;
  --line:#D5D9D2; --plate:#F4C21B; --plate-ink:#15181B; --btn-bg:#15181B; --btn-fg:#FFFFFF;
  --ok:#1E7D45; --ok-bg:#E1F2E7; --warn:#B65E0C; --warn-bg:#FBEBD8; --bad:#BD3528; --bad-bg:#F8E1DD; --live:#1E7D45;
  --shadow:0 1px 2px rgba(21,24,27,.06),0 6px 20px rgba(21,24,27,.06);
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Consolas,monospace;
  --f-plate:"Barlow Condensed","Arial Narrow","Roboto Condensed",sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#111315; --surface:#1A1D20; --surface-2:#22262A; --ink:#ECEEEA; --ink-2:#B3B9B2; --ink-3:#858C86;
    --line:#2F3438; --plate:#F2C230; --plate-ink:#15181B; --btn-bg:#ECEEEA; --btn-fg:#111315;
    --ok:#56C584; --ok-bg:#15301F; --warn:#F0A04B; --warn-bg:#382813; --bad:#F27A6B; --bad-bg:#3B1B18; --live:#56C584;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"]{
  --ground:#111315; --surface:#1A1D20; --surface-2:#22262A; --ink:#ECEEEA; --ink-2:#B3B9B2; --ink-3:#858C86;
  --line:#2F3438; --plate:#F2C230; --plate-ink:#15181B; --btn-bg:#ECEEEA; --btn-fg:#111315;
  --ok:#56C584; --ok-bg:#15301F; --warn:#F0A04B; --warn-bg:#382813; --bad:#F27A6B; --bad-bg:#3B1B18; --live:#56C584;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0}
html,body{background:var(--ground)}
body{color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;padding-inline:16px;padding-block:0 96px}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--plate);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--ink-3)}
.wrap{max-width:1040px;margin:0 auto}
.narrow{max-width:600px;margin:0 auto}

/* top bar */
.topbar{position:sticky;top:0;z-index:20;background:var(--ground);margin-inline:-16px;height:54px;padding:0 16px;display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;letter-spacing:-.01em;font-size:16px;margin-right:auto}
.brand i{display:block;width:22px;height:22px;border-radius:4px;background:repeating-linear-gradient(-45deg,var(--plate) 0 5px,var(--plate-ink) 5px 10px)}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;padding:4px 10px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink-2);white-space:nowrap}
.pill .dot{width:7px;height:7px;border-radius:50%;background:var(--ink-3)}
.pill.live .dot{background:var(--live);box-shadow:0 0 0 3px color-mix(in srgb,var(--live) 25%,transparent)}
.pill.tap{cursor:pointer}

/* buttons */
.btn{text-decoration:none;color:inherit;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:48px;padding:0 18px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);font-weight:500;text-align:center}
.btn:active{transform:translateY(1px)}
.btn.primary{background:var(--btn-bg);color:var(--btn-fg);border-color:var(--btn-bg);font-weight:700}
.btn.big{min-height:64px;font-size:18px;width:100%}
.btn.warn{color:var(--warn)}
.btn.small{min-height:36px;padding:0 12px;font-size:13.5px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn svg{width:22px;height:22px;flex:none}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row>.btn{flex:1 1 0}

h1,h2,h3{margin:0;text-wrap:balance;letter-spacing:-.015em}
h2{font-size:20px}
h3{font-size:15px}
.section{display:flex;flex-direction:column;gap:14px;padding-block:18px}
.eyebrow{font-size:12px;font-weight:700;letter-spacing:.08em;color:var(--ink-3);text-transform:uppercase}

/* board */
.board-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.tally{display:flex;gap:18px;font-size:13.5px;color:var(--ink-2)}
.tally b{font-family:var(--f-mono);font-size:20px;color:var(--ink);display:block;line-height:1.1}
.slips{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.slip{position:relative;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);box-shadow:var(--shadow)}
.slip.urgent{border-color:var(--bad);box-shadow:0 0 0 1px var(--bad),var(--shadow)}
.slip-main{display:flex;flex-direction:column;gap:10px;text-align:left;padding:16px;border:0;background:none;width:100%;border-radius:var(--r)}
.slip-top{display:flex;align-items:center;gap:8px;padding-right:78px;flex-wrap:wrap}
.folders{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:10px}
.folder{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;text-align:left;padding:14px 16px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface-2);width:100%}
.folder:hover{border-color:var(--ink-3)}
.folder.urgent{border-color:var(--bad);box-shadow:0 0 0 1px var(--bad)}
.folder .ico{width:34px;height:34px;color:var(--ink-2)}
.folder.alldone .ico{color:var(--ok)}
.f-body{display:flex;flex-direction:column;gap:6px;min-width:0}
.f-name{font-size:16px;font-weight:700;overflow-wrap:anywhere;line-height:1.3}
.f-meta{font-size:12.5px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.sec-title{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-top:6px}
.fhead{display:flex;align-items:center;gap:8px}
.fhead .t{flex:1;min-width:0}
.fhead h2{overflow-wrap:anywhere}
.ftag{display:inline-flex;align-items:center;gap:4px;font-size:12px;color:var(--ink-3);font-weight:500}
.ftag svg{width:14px;height:14px}
.opts{display:flex;flex-direction:column;gap:6px;max-height:42vh;overflow:auto}
.opt{display:flex;align-items:center;gap:10px;padding:11px 12px;border:1px solid var(--line);border-radius:10px;cursor:pointer;font-size:15px;color:var(--ink)}
.opt input{width:18px;height:18px;accent-color:var(--btn-bg);flex:none}
.opt:has(input:checked){border-color:var(--btn-bg);background:var(--surface-2)}
.urg{position:absolute;top:12px;right:12px;min-height:32px;padding:0 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink-3);font-size:13px;font-weight:700}
.urg[aria-pressed="true"]{background:var(--bad);border-color:var(--bad);color:#fff}
.chip.urgent{background:var(--bad);color:#fff}
.filters{display:flex;gap:6px;flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin-inline:-16px;padding-inline:16px}
.filters::-webkit-scrollbar{display:none}
.flt{flex:none}
.flt{display:inline-flex;align-items:baseline;gap:5px;min-height:38px;padding:0 11px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink-2);font-size:14px}
.flt b{font-family:var(--f-mono);font-size:15px;color:var(--ink)}
.flt[aria-pressed="true"]{background:var(--btn-bg);border-color:var(--btn-bg);color:var(--btn-fg)}
.flt[aria-pressed="true"] b{color:var(--btn-fg)}
.flt.hot b{color:var(--bad)}
.flt.hot[aria-pressed="true"]{background:var(--bad);border-color:var(--bad)}
.flt.hot[aria-pressed="true"] b{color:#fff}
.slip-no{font-family:var(--f-mono);font-weight:600;font-size:15px}
.route{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;font-size:14px}
.route span{color:var(--ink-3);font-size:12.5px}
.route b{font-weight:500;overflow-wrap:anywhere}
.bar{height:8px;border-radius:4px;background:var(--surface-2);overflow:hidden;display:flex}
.bar i{display:block;height:100%}
.bar .d{background:var(--ok)} .bar .s{background:var(--warn)}
.slip-foot{display:flex;justify-content:space-between;font-size:13px;color:var(--ink-2);gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12.5px;font-weight:700;padding:3px 9px;border-radius:6px;white-space:nowrap}
.chip.wait{background:var(--surface-2);color:var(--ink-2)}
.chip.run{background:var(--plate);color:var(--plate-ink)}
.chip.done{background:var(--ok-bg);color:var(--ok)}
.chip.short{background:var(--warn-bg);color:var(--warn)}
.empty{padding:28px 18px;border:1.5px dashed var(--line);border-radius:var(--r);text-align:center;color:var(--ink-2);display:flex;flex-direction:column;gap:12px;align-items:center}
.steps{margin:0;padding:0;list-style:none;display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;counter-reset:s}
.steps li{counter-increment:s;display:flex;gap:10px;align-items:flex-start;font-size:14px;color:var(--ink-2);padding:12px;border-radius:var(--r);background:var(--surface-2)}
.steps li::before{content:counter(s);font-family:var(--f-plate);font-weight:700;font-size:20px;line-height:1;background:var(--plate);color:var(--plate-ink);border-radius:4px;min-width:26px;height:26px;display:grid;place-items:center}

/* pick */
.pickhead{position:sticky;top:54px;z-index:15;background:var(--ground);margin-inline:-16px;padding:10px 16px 12px;display:flex;flex-direction:column;gap:8px;border-bottom:1px solid var(--line)}
.pickhead-top{display:flex;align-items:center;gap:10px}
.back{border:0;background:none;padding:6px;margin-left:-6px;border-radius:8px;display:grid;place-items:center}
.back svg{width:22px;height:22px}
.pickhead .t{min-width:0;flex:1}
.pickhead .t b{display:block;font-family:var(--f-mono);font-size:15px}
.pickhead .t span{display:block;font-size:13px;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.count{font-family:var(--f-mono);font-size:14px;color:var(--ink-2);white-space:nowrap}
.count b{font-size:20px;color:var(--ink)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
.plate{background:var(--plate);color:var(--plate-ink);padding:14px 18px 12px;position:relative}
.plate::after{content:"";position:absolute;left:0;right:0;bottom:0;height:6px;background:repeating-linear-gradient(-45deg,var(--plate-ink) 0 8px,transparent 8px 16px);opacity:.9}
.plate .lbl{font-size:12px;font-weight:700;letter-spacing:.08em;opacity:.75}
.plate .loc{font-family:var(--f-plate);font-weight:700;font-size:clamp(56px,17vw,84px);line-height:.95;letter-spacing:.01em;padding-bottom:8px;overflow-wrap:anywhere}
.plate .alt{font-size:13px;font-weight:500;padding-bottom:8px}
.plate.none{background:var(--surface-2);color:var(--ink-2)}
.plate.none::after{display:none}
.plate.none .loc{font-size:34px;font-family:var(--f-body);letter-spacing:-.02em;padding-block:6px 4px}
.item{padding:16px 18px;display:flex;flex-direction:column;gap:6px}
.item .name{font-size:21px;font-weight:700;line-height:1.3;letter-spacing:-.02em}
.item .meta{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:center;font-size:13.5px;color:var(--ink-2)}
.item .code{font-family:var(--f-mono);font-weight:600;color:var(--ink);font-size:15px}
.qty{display:flex;align-items:baseline;gap:8px;padding:0 18px 16px}
.qty b{font-family:var(--f-mono);font-size:44px;line-height:1;font-weight:600}
.qty span{font-family:var(--f-mono);font-size:22px;color:var(--ink-3)}
.qty em{font-style:normal;font-size:14px;color:var(--ink-2);margin-left:auto}
.actions{display:flex;flex-direction:column;gap:8px;padding:0 18px 18px}
.manual{display:flex;gap:8px}
.manual input{flex:1;min-width:0;min-height:48px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface-2);padding:0 12px;font-family:var(--f-mono)}
.banner{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:var(--r);font-size:14px}
.banner b{display:block;font-size:15px}
.banner.ok{background:var(--ok-bg);color:var(--ok)}
.banner.bad{background:var(--bad-bg);color:var(--bad)}
.banner.warn{background:var(--warn-bg);color:var(--warn)}
.banner .mono{color:inherit}

.list{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden}
.li{display:grid;grid-template-columns:92px 1fr auto;gap:10px;align-items:center;padding:11px 14px;border:0;border-top:1px solid var(--line);background:none;text-align:left;width:100%}
.li:first-child{border-top:0}
.li .l{font-family:var(--f-plate);font-weight:700;font-size:21px;line-height:1}
.li .l.none{font-family:var(--f-body);font-size:12.5px;color:var(--ink-3);font-weight:500}
.li .n{font-size:14px;line-height:1.35;min-width:0}
.li .n small{display:block;font-family:var(--f-mono);color:var(--ink-3);font-size:12px}
.li .q{font-family:var(--f-mono);font-size:14px;text-align:right;white-space:nowrap}
.li.cur{background:color-mix(in srgb,var(--plate) 18%,var(--surface))}
.li.done .n,.li.done .l{color:var(--ink-3)}
.li.done .n{text-decoration:line-through;text-decoration-color:var(--line)}
.li.skip .q::after{content:" · 나중에";color:var(--ink-3);font-family:var(--f-body);font-size:12px}
details.done-box summary{cursor:pointer;font-weight:700;font-size:14px;padding:6px 0;color:var(--ink-2)}
.finish{padding:22px 18px;display:flex;flex-direction:column;gap:12px;align-items:stretch}
.finish h2{font-size:24px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:14px}
.kv span{color:var(--ink-3)}

/* codes */
.codes-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px;align-items:start}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px}
.panel p{margin:0;color:var(--ink-2);font-size:14px}
.tbl-wrap{overflow-x:auto}
table.tbl{border-collapse:collapse;width:100%;font-size:13.5px}
.tbl th,.tbl td{border-bottom:1px solid var(--line);padding:8px 8px;text-align:left;vertical-align:top}
.tbl th{font-size:12px;color:var(--ink-3);font-weight:700;letter-spacing:.04em}
.tbl td.mono{white-space:nowrap}
.x{border:0;background:none;color:var(--ink-3);padding:2px 6px;border-radius:6px;font-size:18px;line-height:1}
.search{min-height:44px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface-2);padding:0 12px;width:100%}

/* tab bar */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom)}
.tabbar .in{display:grid;grid-template-columns:repeat(3,1fr);width:100%;max-width:600px}
.tab{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 4px 10px;font-size:12.5px;color:var(--ink-3);font-weight:500}
.tab svg{width:24px;height:24px}
.tab[aria-current="page"]{color:var(--ink);font-weight:700}
.tab[aria-current="page"] svg{color:var(--ink)}
.tab .badge{font-family:var(--f-mono);font-size:11px;background:var(--plate);color:var(--plate-ink);border-radius:5px;padding:0 5px;margin-left:3px}

/* sheet */
.sheet{position:fixed;inset:0;z-index:60;background:rgba(10,12,14,.55);display:flex;align-items:flex-end;justify-content:center;padding:12px}
.sheet .box{background:var(--surface);color:var(--ink);border-radius:16px;width:100%;max-width:520px;padding:20px;display:flex;flex-direction:column;gap:14px;max-height:88vh;overflow:auto;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.sheet h3{font-size:19px}
.sheet .body{font-size:15px;color:var(--ink-2);display:flex;flex-direction:column;gap:10px}
.sheet .body b{color:var(--ink)}
.sheet input[type=text],.sheet input[type=number]{min-height:52px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface-2);padding:0 14px;width:100%;font-size:18px}
.reasons{display:flex;flex-wrap:wrap;gap:6px}
.reasons label{display:inline-flex}
.reasons input{position:absolute;opacity:0;pointer-events:none}
.reasons span{padding:8px 14px;border-radius:999px;border:1px solid var(--line);font-size:14px;cursor:pointer}
.reasons input:checked+span{background:var(--btn-bg);color:var(--btn-fg);border-color:var(--btn-bg)}
.reasons input:focus-visible+span{outline:3px solid var(--plate);outline-offset:2px}
.sheet .acts{display:flex;flex-direction:column;gap:8px}

/* toast */
.toast{position:fixed;left:50%;top:64px;transform:translateX(-50%);z-index:80;background:var(--btn-bg);color:var(--btn-fg);padding:10px 16px;border-radius:10px;font-size:14px;max-width:calc(100% - 32px);box-shadow:var(--shadow);text-align:center}

/* scanner: single dark world by design */
.scanner{position:fixed;inset:0;z-index:50;background:#0B0D0F;color:#F2F3F0;display:flex;flex-direction:column}
.scanner video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.scanner .aim{position:absolute;left:7%;right:7%;top:39%;height:20%;border:3px solid rgba(255,255,255,.85);border-radius:14px;box-shadow:0 0 0 100vmax rgba(0,0,0,.45);transition:border-color .15s}
.scanner .aim::after{content:"";position:absolute;left:6%;right:6%;top:50%;height:2px;background:#F4C21B;opacity:.9}
.scanner .aim.hit{border-color:#56C584}
.scanner .aim.miss{border-color:#F27A6B}
.scanner .top{position:relative;display:flex;justify-content:space-between;align-items:center;padding:14px 16px;gap:10px}
.scanner .top .hint{font-size:14px;opacity:.9}
.scanner .close{border:0;background:rgba(255,255,255,.14);color:#fff;border-radius:999px;min-height:44px;padding:0 18px;font-weight:700;white-space:nowrap}
.scanner .close[aria-pressed="true"]{background:#F4C21B;color:#15181B}
.scanner .bottom{position:relative;margin-top:auto;padding:14px 16px calc(16px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:10px;background:linear-gradient(transparent,rgba(0,0,0,.75) 30%)}
.scanner .mini{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;background:#1A1D20;border-radius:12px;padding:10px 12px}
.scanner .mini .l{background:#F4C21B;color:#15181B;font-family:var(--f-plate);font-weight:700;font-size:28px;line-height:1;padding:6px 10px;border-radius:6px}
.scanner .mini .l.none{background:#2F3438;color:#B3B9B2;font-family:var(--f-body);font-size:13px;padding:8px 10px}
.scanner .mini .n{font-size:14px;line-height:1.3;min-width:0}
.scanner .mini .n small{display:block;font-family:var(--f-mono);color:#9AA19A;font-size:12px}
.scanner .mini .q{font-family:var(--f-mono);font-size:22px}
.scanner .status{min-height:48px;border-radius:12px;padding:10px 14px;font-size:14.5px;background:rgba(255,255,255,.1)}
.scanner .status.ok{background:#15301F;color:#8FE0AE}
.scanner .status.bad{background:#3B1B18;color:#FFB0A5}
.scanner .status.warn{background:#382813;color:#FFD08F}
.scanner .photo{display:flex;flex-direction:column;gap:12px;align-items:center;justify-content:center;flex:1;padding:24px;text-align:center;position:relative}
.scanner .photo p{margin:0;max-width:34ch;color:#C9CEC8;font-size:15px}
.scanner .shoot{background:#F4C21B;color:#15181B;border:0;border-radius:14px;min-height:64px;padding:0 28px;font-size:18px;font-weight:700;display:inline-flex;gap:10px;align-items:center}

<body>
<header class="topbar">
  <div class="brand"><i aria-hidden="true"></i><span>오더피킹</span></div>
  <button id="syncPill" class="pill tap" type="button" title="저장 위치"><span class="dot"></span><span id="syncText">연결 중</span></button>
  <button id="workerPill" class="pill tap" type="button" title="작업자 이름 바꾸기">작업자 설정</button>
</header>

<main>
  <section id="view-board" class="wrap section" aria-label="전표 현황"></section>
  <section id="view-pick" class="wrap" aria-label="피킹" hidden></section>
  <section id="view-codes" class="wrap section" aria-label="바코드" hidden></section>
</main>

<nav class="tabbar" aria-label="화면 이동">
  <div class="in">
    <button class="tab" type="button" data-tab="board" id="tab-board">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3.5" y="4" width="17" height="16" rx="2"/><path d="M7.5 9h9M7.5 12.5h9M7.5 16h5"/></svg>
      <span>전표 현황</span>
    </button>
    <button class="tab" type="button" data-tab="pick" id="tab-pick">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M4 7l8-4 8 4v10l-8 4-8-4z"/><path d="M4 7l8 4 8-4M12 11v10"/></svg>
      <span>피킹<span id="pickBadge"></span></span>
    </button>
    <button class="tab" type="button" data-tab="codes" id="tab-codes">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M4 5v14M7 5v14M10.5 5v14M13 5v14M17 5v14M20 5v14" stroke-linecap="round"/></svg>
      <span>재고 조회</span>
    </button>
  </div>
</nav>

<div id="scanner" class="scanner" hidden>
  <video id="video" playsinline muted></video>
  <div id="aim" class="aim" hidden></div>
  <div class="top">
    <span class="hint" id="scanHint">바코드를 노란 선에 비추세요</span>
    <span class="row" style="flex-wrap:nowrap">

  <div id="photoBox" class="photo" hidden>

      임시로 사진 찍어 읽기
    </button>
  </div>
  <div class="bottom">
    <div id="scanStatus" class="status">상품 바코드를 비추면 자동으로 담겨요.</div>

  </div>
</div>

<div id="sheet" class="sheet" hidden><div class="box" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" id="sheetBox"></div></div>

<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@zxing/library@0.21.3/umd/index.min.js"></script>
<script>
/* 구글 시트 웹 앱 주소. 비워 두면 링크의 ?api=주소 로 한 번 받아 폰에 기억해요. (Apps Script 안에서는 필요 없어요) */
const OPK_API_URL = '';
(() => {
'use strict';
/* ---------- helpers ---------- */
const $ = (s, r = document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const LS = {
  get(k, d){ try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch(e){ return d; } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }
};
const coll = new Intl.Collator('ko', {numeric:true, sensitivity:'base'});
const isObj = v => v && typeof v === 'object' && !Array.isArray(v);
function merge(a, b){
  const out = isObj(a) ? {...a} : {};
  for (const k in b){ out[k] = isObj(b[k]) && isObj(out[k]) ? merge(out[k], b[k]) : (isObj(b[k]) ? merge({}, b[k]) : b[k]); }
  return out;
}
const pad = n => String(n).padStart(2, '0');
function fmtTime(t){ if (!t) return ''; const d = new Date(t); return `${d.getMonth()+1}/${d.getDate()} ${pad(d.getHours())}:${pad(d.getMinutes())}`; }
function fmtFull(t){ if (!t) return ''; const d = new Date(t); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`; }
function mins(a, b){ if (!a || !b) return ''; const m = Math.max(1, Math.round((b - a) / 60000)); return m >= 60 ? `${Math.floor(m/60)}시간 ${m%60}분` : `${m}분`; }
const normBc = v => String(v ?? '').replace(/\s+/g, '').trim();
const safeId = s => { let id = String(s).trim().replace(/[^A-Za-z0-9_\-.~:@+]/g, '_').slice(0, 120); if (!id || id === '.' || id === '..') id = 'slip_' + Date.now(); return id; };
const shardOf = bc => 'b' + (/\d$/.test(bc) ? bc.slice(-1) : 'x');

/* ---------- feedback ---------- */
let actx = null;
function beep(ok){
  try {
    actx = actx || new (window.AudioContext || window.webkitAudioContext)();
    const tones = ok ? [[1320, 0, .09]] : [[220, 0, .14], [180, .18, .18]];
    tones.forEach(([f, at, dur]) => {
      const o = actx.createOscillator(), g = actx.createGain();
      o.type = ok ? 'sine' : 'square'; o.frequency.value = f;
      g.gain.setValueAtTime(.0001, actx.currentTime + at);
      g.gain.exponentialRampToValueAtTime(ok ? .35 : .18, actx.currentTime + at + .01);
      g.gain.exponentialRampToValueAtTime(.0001, actx.currentTime + at + dur);
      o.connect(g).connect(actx.destination); o.start(actx.currentTime + at); o.stop(actx.currentTime + at + dur + .02);
    });
  } catch(e){}
  try { navigator.vibrate && navigator.vibrate(ok ? 40 : [90, 60, 90]); } catch(e){}
}
let toastT = 0;
function toast(msg){ const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => t.hidden = true, 2600); }

/* ---------- dialog (bottom sheet) ---------- */
let sheetResolve = null;
function ask({title, body = '', html = '', actions = [{label:'확인', value:true, kind:'primary'}]}){
  return new Promise(res => {
    if (sheetResolve) sheetResolve(null);
    sheetResolve = res;
    scanner.paused = true;
    const box = $('#sheetBox');
    box.innerHTML = `<h3 id="sheetTitle">${esc(title)}</h3>${body || html ? `<div class="body">${body ? `<div>${body}</div>` : ''}${html}</div>` : ''}
      <div class="acts">${actions.map((a, i) => `<button type="button" class="btn ${a.kind || ''} ${i === 0 ? 'big' : ''}" data-i="${i}">${esc(a.label)}</button>`).join('')}</div>`;
    $('#sheet').hidden = false;
    box.querySelectorAll('[data-i]').forEach(b => b.onclick = () => {
      const a = actions[+b.dataset.i];
      const v = typeof a.value === 'function' ? a.value(box) : a.value;
      if (v === undefined) return; // validation failed, keep open
      close(v);
    });
    const first = box.querySelector('input') || box.querySelector('[data-i="0"]');
    setTimeout(() => first && first.focus(), 30);
    function close(v){ $('#sheet').hidden = true; box.innerHTML = ''; sheetResolve = null; setTimeout(() => scanner.paused = false, 350); res(v); }
    $('#sheet').onclick = e => { if (e.target.id === 'sheet') close(null); };
  });
}

/* ---------- store: 구글 시트(sheet) · claude 공유(claude) · 이 기기(local) ---------- */
const okApi = u => typeof u === 'string' && (/^https:\/\/script\.google(usercontent)?\.com\//.test(u) || /^\/[^/]/.test(u));
let API_URL = OPK_API_URL;
try {
  const q = new URLSearchParams(location.search).get('api');
  if (q && okApi(q)) { LS.set('opk.api', q); history.replaceState(null, '', location.pathname + location.hash); }
  if (!API_URL) API_URL = LS.get('opk.api', '');
} catch(e){}
const store = { mode:'local', shared:false, db:null, ready:false, slips:{}, progress:{}, codes:{}, folders:{}, sheetUrl:'', stockInfo:null };
const expandCodes = raw => { const o = {}; for (const bc in raw) { const v = raw[bc]; o[bc] = Array.isArray(v) ? {c:v[0], n:v[1] || ''} : v; } return o; };
function saveCodesCache(){ try { localStorage.setItem('opk.codesCache', JSON.stringify({v:GS.codesVer, m:store.codes})); } catch(e){} }
function loadCodesCache(){ try { const c = JSON.parse(localStorage.getItem('opk.codesCache') || 'null'); if (c && c.v && c.m) { store.codes = c.m; GS.codesVer = c.v; } } catch(e){} }
function loadLocal(){
  store.slips = LS.get('opk.slips', {}); store.progress = LS.get('opk.progress', {}); store.codes = LS.get('opk.codes', {}); store.folders = LS.get('opk.folders', {});
}
function saveLocal(){ if (store.shared) return; LS.set('opk.slips', store.slips); LS.set('opk.progress', store.progress); LS.set('opk.codes', store.codes); LS.set('opk.folders', store.folders); }
function setSync(mode){
  const p = $('#syncPill'), t = $('#syncText');
  p.classList.toggle('live', mode === 'live' || mode === 'sheet');
  t.textContent = mode === 'sheet' ? '구글 시트 연결' : mode === 'live' ? '실시간 공유' : mode === 'error' ? '연결 끊김' : mode === 'wait' ? '연결 중' : '이 기기에만 저장';
  p.title = mode === 'sheet' ? '모든 기록이 구글 시트에 저장되고, 몇 초마다 다른 사람의 작업이 반영돼요'
    : mode === 'live' ? '같은 페이지를 연 사람들과 현황이 바로 공유돼요'
    : mode === 'error' ? '잠시 연결이 끊겼어요. 자동으로 다시 시도해요' : '공유 저장소를 쓸 수 없어 이 기기 브라우저에만 저장돼요';
}
function writeErr(e){
  const code = e && e.code;
  if (code === 'quota_exceeded') toast('저장 공간이 가득 찼어요. 끝난 전표를 몇 개 지워 주세요.');
  else toast('저장하지 못했어요. 인터넷 연결을 확인하고 다시 해 주세요.');
}

/* 구글 시트: Apps Script 안에서 열리면 google.script.run, 다른 곳에 올리면 OPK_API_URL 로 호출 */
const GS = { ver:'', codesVer:'', q:Promise.resolve(), pending:0, seq:0, timer:0, fails:0 };
const inAppsScript = () => !!(window.google && window.google.script && window.google.script.run);
function gsCall(action, data){
  if (inAppsScript()) return new Promise((res, rej) => window.google.script.run.withSuccessHandler(res).withFailureHandler(rej).api(action, data || {}));
  return fetch(API_URL, {method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body:JSON.stringify({action, data: data || {}})})
    .then(r => r.json()).then(j => { if (!j.ok) throw new Error(j.message || '요청 실패'); return j.result; });
}
function gsWrite(action, data){ // 쓰기는 보낸 순서대로 하나씩
  GS.pending++; GS.seq++;
  const job = GS.q.then(() => gsCall(action, data))
    .catch(e => { writeErr(e); GS.ver = ''; })
    .finally(() => { GS.pending--; if (!GS.pending) gsSoon(250); });
  GS.q = job; return job;
}
function gsSoon(ms){ clearTimeout(GS.timer); GS.timer = setTimeout(gsSync, ms); }
async function gsSync(){
  clearTimeout(GS.timer);
  if (GS.pending) return gsSoon(800);
  const seq = GS.seq;
  try {
    const r = await gsCall('sync', {ver:GS.ver, codesVer:GS.codesVer});
    GS.fails = 0;
    if (seq === GS.seq && !GS.pending) {
      if (r.slips) { store.slips = r.slips; store.progress = r.progress; store.folders = r.folders || {}; }
      if (r.codes) { store.codes = expandCodes(r.codes); GS.codesVer = r.codesVer; saveCodesCache(); }
      if (r.stockInfo) store.stockInfo = r.stockInfo;
      GS.ver = r.ver;
      store.sheetUrl = r.sheetUrl || ''; store.ready = true; setSync('sheet');
      if (r.slips || r.codes) render();
    }
  } catch(e){ GS.fails++; setSync('error'); }
  if (seq !== GS.seq || GS.pending) return gsSoon(400);
  gsSoon(document.hidden ? 30000 : Math.min(30000, 6000 * (1 + GS.fails)));
}
document.addEventListener('visibilitychange', () => { if (!document.hidden && store.mode === 'sheet') gsSoon(100); });

async function initStore(){
  if (inAppsScript() || API_URL) {
    store.mode = 'sheet'; store.shared = true; loadCodesCache(); setSync('wait'); render();
    await gsSync(); return;
  }
  loadLocal(); setSync('local'); render();
  if (!window.claude || typeof window.claude.use !== 'function') { store.ready = true; render(); return; }
  let db = null;
  try { db = await window.claude.use('db'); } catch(e){ db = null; }
  if (!db) { store.ready = true; render(); return; }
  store.mode = 'claude'; store.db = db; store.shared = true; store.slips = {}; store.progress = {}; store.codes = {}; store.folders = {};
  setSync('live');
  const onErr = () => setSync('error');
  db.collection('slips').onSnapshot(snap => {
    const o = {}; snap.docs.forEach(d => { if (d.exists) o[d.id] = d.data(); }); store.slips = o; store.ready = true; render();
  }, onErr);
  db.collection('folders').onSnapshot(snap => {
    const o = {}; snap.docs.forEach(d => { if (d.exists) o[d.id] = d.data(); }); store.folders = o; render();
  }, onErr);
  db.collection('progress').onSnapshot(snap => {
    const o = {}; snap.docs.forEach(d => { if (d.exists) o[d.id] = d.data(); }); store.progress = o; render();
  }, onErr);
  db.collection('barcodes').onSnapshot(snap => {
    const o = {};
    snap.docs.forEach(d => { if (!d.exists) return; const m = d.data().map || {}; for (const k in m) if (m[k]) o[k] = m[k]; });
    store.codes = o; render();
  }, onErr);
}
async function upsert(path, patch){
  const ref = store.db.doc(path);
  try { await ref.update(patch); }
  catch(e){ if (e && e.code === 'invalid_argument') await ref.set(patch); else throw e; }
}
async function putSlip(slip, replace){
  store.slips = {...store.slips, [slip.id]: slip};
  if (replace) { const p = {...store.progress}; delete p[slip.id]; store.progress = p; }
  render();
  if (store.mode === 'sheet') return gsWrite('putSlip', {slip, replace: !!replace});
  if (store.mode === 'claude') { try { if (replace) await store.db.doc('progress/' + slip.id).delete(); await store.db.doc('slips/' + slip.id).set(slip); } catch(e){ writeErr(e); } }
  else saveLocal();
}
async function putSlips(items, folder){ // [{slip, replace}], 새 폴더(있으면 함께 저장)
  const sl = {...store.slips}, pr = {...store.progress};
  items.forEach(({slip, replace}) => { sl[slip.id] = slip; if (replace) delete pr[slip.id]; });
  store.slips = sl; store.progress = pr;
  if (folder) store.folders = {...store.folders, [folder.id]: folder};
  render();
  if (store.mode === 'sheet') { for (let i = 0; i < items.length; i += 10) await gsWrite('putSlips', {items: items.slice(i, i + 10), folder: i === 0 ? folder || null : null}); return; }
  if (store.mode === 'claude' && folder) { try { await store.db.doc('folders/' + folder.id).set(folder); } catch(e){ writeErr(e); } }
  if (store.mode === 'claude') { for (const {slip, replace} of items) { try { if (replace) await store.db.doc('progress/' + slip.id).delete(); await store.db.doc('slips/' + slip.id).set(slip); } catch(e){ writeErr(e); } } return; }
  saveLocal();
}
/* ---------- 폴더 ---------- */
const newFolderId = () => 'f' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const folderOf = s => (s && s.folder && store.folders[s.folder]) ? s.folder : '';
async function saveFolder(f){
  store.folders = {...store.folders, [f.id]: f}; render();
  if (store.mode === 'sheet') return gsWrite('putFolder', {folder: f});
  if (store.mode === 'claude') { try { await store.db.doc('folders/' + f.id).set(f); } catch(e){ writeErr(e); } }
  else saveLocal();
}
async function removeFolder(id){
  const fo = {...store.folders}; delete fo[id]; store.folders = fo;
  const sl = {...store.slips}; const moved = [];
  Object.values(sl).forEach(x => { if (x.folder === id) { sl[x.id] = {...x, folder:''}; moved.push(x.id); } });
  store.slips = sl; render();
  if (store.mode === 'sheet') return gsWrite('deleteFolder', {id});
  if (store.mode === 'claude') { try { await store.db.doc('folders/' + id).delete(); for (const sid of moved) await store.db.doc('slips/' + sid).update({folder:''}); } catch(e){ writeErr(e); } }
  else saveLocal();
}
async function moveSlips(ids, folder){
  const sl = {...store.slips}; ids.forEach(id => { if (sl[id]) sl[id] = {...sl[id], folder}; }); store.slips = sl; render();
  if (store.mode === 'sheet') return gsWrite('moveSlips', {ids, folder});
  if (store.mode === 'claude') { try { for (const id of ids) await store.db.doc('slips/' + id).update({folder}); } catch(e){ writeErr(e); } }
  else saveLocal();
}
async function putProgress(id, patch){
  store.progress = {...store.progress, [id]: merge(store.progress[id] || {}, patch)}; render();
  if (store.mode === 'sheet') return gsWrite('setProgress', {id, patch});
  if (store.mode === 'claude') { try { await upsert('progress/' + id, patch); } catch(e){ writeErr(e); } }
  else saveLocal();
}
async function removeSlip(id){
  const s = {...store.slips}; delete s[id]; store.slips = s;
  const p = {...store.progress}; delete p[id]; store.progress = p; render();
  if (store.mode === 'sheet') return gsWrite('deleteSlip', {id});
  if (store.mode === 'claude') { try { await store.db.doc('slips/' + id).delete(); await store.db.doc('progress/' + id).delete(); } catch(e){ writeErr(e); } }
  else saveLocal();
}
async function addCodes(entries){ // {barcode: {c, n, w, t}} ; value null = remove
  const c = {...store.codes};
  for (const k in entries) { if (entries[k]) c[k] = entries[k]; else delete c[k]; }
  store.codes = c; render();
  if (store.mode === 'sheet') {
    const keys = Object.keys(entries); let last = null;
    for (let i = 0; i < keys.length; i += 1500) { const part = {}; keys.slice(i, i + 1500).forEach(k => part[k] = entries[k]); last = await gsWrite('addCodes', {map: part}); }
    if (last && last.codesVer) { GS.codesVer = last.codesVer; saveCodesCache(); }
    return;
  }
  if (store.mode !== 'claude') { saveLocal(); return; }
  const byShard = {};
  for (const k in entries) (byShard[shardOf(k)] ||= {})[k] = entries[k];
  try { for (const s in byShard) await upsert('barcodes/' + s, {map: byShard[s]}); } catch(e){ writeErr(e); }
}
function itemCodes(){ const m = {}; for (const bc in store.codes) { const v = store.codes[bc]; if (v && v.c) (m[v.c] ||= []).push(bc); } return m; }

/* ---------- excel parsing ---------- */
function splitLoc(v){
  const parts = [...new Set(String(v ?? '').split('/').map(s => s.trim()).filter(Boolean))];
  return {loc: parts[0] || '', alt: parts.slice(1).join(', ')};
}
function sortLines(lines){
  return lines.map((l, i) => ({...l, _i:i}))
    .sort((a, b) => (!a.loc - !b.loc) || coll.compare(a.loc, b.loc) || a._i - b._i)
    .map((l, k) => { const {_i, ...rest} = l; return {...rest, k}; });
}
function sheetRows(ws){ return XLSX.utils.sheet_to_json(ws, {header:1, defval:'', raw:true, blankrows:false}); }
/* 전표 엑셀 읽기 — 한 파일에 전표가 여러 장이어도 나눠서 읽어요
   ① 시트마다 1장  ② 한 시트에 '품목코드' 제목 줄이 여러 번 (이카운트 여러 전표 한꺼번에 받기)
   ③ 한 표에 '전표번호'(또는 일자-No.) 열이 있고 줄마다 전표가 섞인 경우 */
let zeroLines = 0;
function parseSlips(wb, fileName){
  const out = []; const base = fileName.replace(/\.[^.]+$/, '');
  const txt = v => String(v ?? '').trim();

/* 재고현황 엑셀 → [바코드, 품목코드, 품목명, 규격, 사이즈, 재고수량, 미판매, 미입고, 로케이션, 적요, 기준시각] */
function parseStock(wb){

  wb.SheetNames.forEach(sn => {
    const rows = sheetRows(wb.Sheets[sn]);

    if (hi < 0) return;

      cSize = like('사이즈'), cQty = like('재고수량'), cUn = like('미판매'), cIn = like('미입고'),
      cLoc = like('창고번호', '로케이션', '위치'), cMemo = like('적요');

    if (md && !meta.at) meta.at = `${md[1]}-${String(md[2]).padStart(2, '0')}-${String(md[3]).padStart(2, '0')}`;
    const wh = top.split('/').map(x => x.trim()).find(x => x.includes('창고'));

    for (let i = hi + 1; i < rows.length; i++){
      const r = rows[i]; const code = cell(r[cCode]); if (!code) continue;
      let bc = cBc >= 0 ? normBc(r[cBc]) : '';

      rowsOut.push([bc, code, cell(r[cName]), cell(r[cSpec]), cell(r[cSize]), num(r[cQty]), num(r[cUn]), num(r[cIn]),

}
function parseCodeBook(wb){
  const out = {}; let skipped = 0;
  wb.SheetNames.forEach(sn => {
    const rows = sheetRows(wb.Sheets[sn]);
    const hi = rows.findIndex(r => r.some(c => String(c).includes('바코드')) && r.some(c => String(c).includes('품목코드') || String(c).trim() === '코드'));
    if (hi < 0) return;
    const head = rows[hi].map(c => String(c).trim());
    const cBc = head.findIndex(h => h.includes('바코드'));
    let cCode = head.findIndex(h => h === '품목코드'); if (cCode < 0) cCode = head.findIndex(h => h.includes('품목코드') || h === '코드');
    const cName = head.findIndex(h => h.includes('품목명'));
    for (let i = hi + 1; i < rows.length; i++){
      const r = rows[i]; const code = String(r[cCode] ?? '').trim();

function readFile(file){
  return new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onload = () => { try { res(XLSX.read(new Uint8Array(fr.result), {type:'array'})); } catch(e){ rej(e); } };
    fr.onerror = () => rej(fr.error); fr.readAsArrayBuffer(file);

const worker = () => LS.get('opk.worker', '');
function info(slip, prog, k){

/* 피킹 순서: 메인 로케이션('/' 앞) 기준. 전표에 위치가 없으면 재고표 메인 위치로. 구역-열-단 칸별로 숫자까지 비교 */
const mainLoc = l => String(l.loc || l.sloc || '').split('/')[0].trim();

  const A = a.split('-'), B = b.split('-');
  for (let i = 0; i < Math.max(A.length, B.length); i++){
    if (A[i] === undefined) return -1; if (B[i] === undefined) return 1;

  }

}

  orderCache.set(slip, o); return o;

/* ---------- actions ---------- */
async function needWorker(){
  if (worker()) return true;
  const name = await ask({title:'작업자 이름을 알려 주세요', body:'현황판에 누가 피킹 중인지 표시돼요. 이 기기에 기억해 둘게요.',
    html:'<input type="text" id="wName" maxlength="12" placeholder="예: 김민수">',
    actions:[{label:'시작하기', kind:'primary', value: box => { const v = box.querySelector('#wName').value.trim(); if (!v) { box.querySelector('#wName').focus(); return undefined; } return v; }}, {label:'취소', value:null}]});
  if (!name) return false; LS.set('opk.worker', name); render(); return true;
}
async function openSlip(id){
  const slip = store.slips[id]; if (!slip) return;
  if (!(await needWorker())) return;
  const prog = store.progress[id];
  if (prog && prog.status === 'picking' && prog.worker && prog.worker !== worker() && Date.now() - (prog.updatedAt || 0) < 30 * 60000) {
    const ok = await ask({title:`${prog.worker}님이 피킹 중이에요`, body:`마지막 기록 ${fmtTime(prog.updatedAt)}. 같이 이어서 할까요?`, actions:[{label:'이어서 하기', value:true, kind:'primary'}, {label:'취소', value:false}]});
    if (!ok) return;
  }
  if (ui.slipId !== id) { ui.skipped = new Set(); ui.cur = -1; ui.last = null; }
  ui.slipId = id; LS.set('opk.slip', id);
  go('pick'); // 열기만 해서는 '피킹 중'이 되지 않아요. 첫 스캔·기록부터 시작
}
/* 첫 기록 때 '피킹 중'으로 바꾸고 작업자를 남김 */
function startPatch(){
  const prog = curProg(); const now = Date.now();
  const p = {status:'picking', worker:worker(), updatedAt:now, finishedAt:null};
  if (!prog || !prog.startedAt || !prog.status) p.startedAt = now;
  return p;
}
async function addPick(k, n, via){
  const slip = curSlip(); if (!slip) return; const prog = curProg(); const i = info(slip, prog, k);
  const np = Math.min(i.l.qty, i.p + n); const done = np >= i.l.qty;
  await putProgress(slip.id, {...startPatch(), lines:{[k]: {p:np, s: done ? 'done' : '', r:'', t:Date.now(), w:worker(), v: via || 'scan'}}});
  beep(true);
  ui.last = {kind:'ok', title: done ? `담았어요 · ${i.l.name}` : `${np}/${i.l.qty} · ${i.l.qty - np}개 더`, detail:''};
  scanStatus('ok', done ? `✓ ${i.l.name} 다 담았어요` : `✓ ${np}/${i.l.qty} · 같은 상품 ${i.l.qty - np}개 더 찍어 주세요`);
  if (done) setTimeout(() => { if (ui.cur === k || ui.cur < 0) { ui.cur = nextPending(); } render();
    if (ui.cur < 0) { scanStatus('ok', '✓ 전표의 모든 품목을 확인했어요'); setTimeout(closeScanner, 900); } }, 450);
  else render();
}
async function markShort(k){
  const slip = curSlip(); const i = info(slip, curProg(), k);
  const res = await ask({title:'부족·결품 처리', body:`<b>${esc(i.l.name)}</b><br>요청 ${i.l.qty}개 중 실제로 담은 수량을 적어 주세요.`,
    html:`<input type="number" id="shortQty" min="0" max="${i.l.qty}" inputmode="numeric" value="${i.p}">
      <div class="reasons" role="radiogroup" aria-label="사유">${['재고 없음', '수량 부족', '파손', '위치에 없음', '기타'].map((r, n) => `<label><input type="radio" name="rsn" value="${r}" ${n === 0 ? 'checked' : ''}><span>${r}</span></label>`).join('')}</div>`,
    actions:[{label:'부족으로 기록', kind:'primary', value: box => { const q = Math.max(0, Math.min(i.l.qty, parseInt(box.querySelector('#shortQty').value || '0', 10) || 0)); const r = (box.querySelector('input[name=rsn]:checked') || {}).value || ''; return {q, r}; }}, {label:'취소', value:null}]});
  if (!res) return;
  const full = res.q >= i.l.qty;
  await putProgress(slip.id, {...startPatch(), lines:{[k]: {p:res.q, s: full ? 'done' : 'short', r: full ? '' : res.r, t:Date.now(), w:worker(), v:'manual'}}});
  ui.last = null; ui.cur = nextPending(); render(); toast(full ? '다 담은 것으로 기록했어요' : '부족으로 기록했어요');
}
async function toggleUrgent(id){
  const s0 = store.slips[id]; if (!s0) return;
  const on = !s0.urgent;
  store.slips = {...store.slips, [id]: {...s0, urgent: on}}; render();
  toast(on ? '긴급으로 지정했어요 · 맨 위에 보여요' : '긴급을 해제했어요');
  if (store.mode === 'sheet') return gsWrite('setProgress', {id, patch:{urgent: on}});
  if (store.mode === 'claude') { try { await store.db.doc('slips/' + id).update({urgent: on}); } catch(e){ writeErr(e); } }
  else saveLocal();
}
async function resetSlip(id){
  const slip = store.slips[id]; const prog = store.progress[id];
  const lines = Object.values((prog && prog.lines) || {}).filter(x => x && (x.p || x.s));
  const q = lines.reduce((a, x) => a + (Number(x.p) || 0), 0);
  const ok = await ask({title:'대기 상태로 되돌릴까요?',
    body: `<b class="mono">${esc(slip.no)}</b><br>${lines.length ? `지금까지 담은 기록 ${lines.length}건(수량 ${q}개)도 함께 지워져요. 담아 둔 상품은 제자리에 돌려놓아 주세요.` : '아직 담은 품목은 없어요. 작업자 표시만 지워져요.'}`,
    actions:[{label:'대기로 되돌리기', value:true, kind:'primary'}, {label:'취소', value:false}]});
  if (!ok) return;
  const p = {...store.progress}; delete p[id]; store.progress = p;
  ui.skipped = new Set(); ui.cur = -1; ui.last = null; ui.slipId = ''; LS.set('opk.slip', '');
  go('board'); toast('대기 상태로 되돌렸어요');
  if (store.mode === 'sheet') return gsWrite('resetSlip', {id});
  if (store.mode === 'claude') { try { await store.db.doc('progress/' + id).delete(); } catch(e){ writeErr(e); } }
  else saveLocal();
}
async function finishSlip(){
  const slip = curSlip(); await putProgress(slip.id, {status:'done', finishedAt:Date.now(), updatedAt:Date.now(), worker: curProg() && curProg().worker || worker()});
  beep(true); toast('피킹 완료로 기록했어요');
}

/* ---------- scanning ---------- */
function flash(kind, title, detail){
  ui.last = {kind, title, detail}; beep(kind === 'ok'); scanStatus(kind, (kind === 'ok' ? '✓ ' : '✕ ') + title + (detail ? ` · ${detail}` : '')); render();
}
async function onScan(raw){
  const bc = normBc(raw); if (!bc) return;
  if (ui.view === 'codes') { ui.stockQ = bc; stockSearch(bc); return; }
  if (ui.view !== 'pick' || !curSlip()) { toast(`바코드 ${bc} — 피킹 화면에서 찍어 주세요`); return; }
  const slip = curSlip(); const prog = curProg(); ensureCur();
  const hit = store.codes[bc];
  if (hit) {
    const matches = slip.lines.filter(l => l.code === hit.c);
    if (!matches.length) return flash('bad', '이 전표에 없는 상품이에요', `${hit.n || hit.c}`);
    const target = matches.find(l => l.k === ui.cur && !info(slip, prog, l.k).s) || matches.find(l => !info(slip, prog, l.k).s);
    if (!target) return flash('warn', '이미 다 담은 상품이에요', `${hit.n || hit.c} · 요청 ${matches.reduce((a, l) => a + l.qty, 0)}개`);
    if (target.k !== ui.cur) {
      beep(false);
      const ok = await ask({title:'다른 위치의 상품이에요', body:`지금 찍은 상품은 <b>${esc(target.name)}</b><br>위치 <b class="mono">${esc(target.loc || '없음')}</b> 품목이에요.<br>이 상품을 먼저 담을까요?`,
        actions:[{label:'이 상품 담기', value:true, kind:'primary'}, {label:'취소', value:false}]});
      if (!ok) return;
      ui.cur = target.k;
    }
    return addPick(target.k, 1, 'scan');
  }
  const l = slip.lines[ui.cur]; if (!l) return flash('bad', '처음 보는 바코드예요', bc);
  const has = (itemCodes()[l.code] || []).length > 0;
  beep(false);
  const ok = await ask({title: has ? '등록된 바코드와 달라요' : '처음 보는 바코드예요',
    body: has ? `<span class="mono">${esc(bc)}</span><br>지금 품목 <b>${esc(l.name)}</b>에는 다른 바코드가 등록돼 있어요.<br>상품을 다시 확인해 주세요. 같은 상품의 다른 포장이라면 추가로 등록할 수 있어요.`
      : `<span class="mono">${esc(bc)}</span> 를<br><b>${esc(l.name)}</b> <span class="mono">(${esc(l.code)})</span><br>의 바코드로 등록하고 1개 담을까요?<br><small>상품 포장의 이름이 맞는지 한 번 더 봐 주세요.</small>`,
    actions: has ? [{label:'다른 상품이에요 (취소)', value:false, kind:'primary'}, {label:'같은 상품 · 바코드 추가 등록', value:true}]
      : [{label:'등록하고 담기', value:true, kind:'primary'}, {label:'취소', value:false}]});
  if (!ok) { if (has) flash('bad', '다른 상품이에요', bc); return; }
  await addCodes({[bc]: {c:l.code, n:l.name, w:worker(), t:Date.now()}});
  addPick(ui.cur, 1, 'scan');
}

const scanner = { mode:'pick', stream:null, running:false, paused:false, detector:null, zx:null, zxHints:null, canvas:null, lastCode:'', lastSeen:0, idleT:0, torchOn:false };
function scanStatus(kind, text){ const s = $('#scanStatus'); if (!s) return; s.className = 'status ' + (kind || ''); s.textContent = text;
  const a = $('#aim'); if (a && kind) { a.classList.remove('hit', 'miss'); a.classList.add(kind === 'ok' ? 'hit' : 'miss'); setTimeout(() => a.classList.remove('hit', 'miss'), 600); } }
function renderMini(){
  const box = $('#scanMini');
  if (scanner.mode === 'lookup') { if (!box.dataset.filled) box.innerHTML = '<span class="n">바코드를 비추면 재고를 보여드려요</span>'; return; }
  const slip = curSlip(); if (!slip || ui.cur < 0) { box.innerHTML = '<span class="n">남은 품목이 없어요</span>'; return; }
  const i = info(slip, curProg(), ui.cur);
  box.innerHTML = `<span class="l ${mainLoc(i.l) ? '' : 'none'}">${esc(mainLoc(i.l) || '위치 없음')}</span><span class="n">${esc(i.l.name)}<small>${esc(i.l.code)}</small></span><span class="q">${i.p}/${i.l.qty}</span>`;
}
async function makeDetector(){
  if (scanner.detector !== null && scanner.detector !== undefined) return scanner.detector;
  scanner.detector = false;
  if ('BarcodeDetector' in window) {
    try { const fm = await window.BarcodeDetector.getSupportedFormats(); const want = ['ean_13', 'ean_8', 'upc_a', 'upc_e', 'code_128', 'code_39', 'itf'].filter(f => fm.includes(f));
      if (want.length) scanner.detector = new window.BarcodeDetector({formats: want}); } catch(e){}
  }
  if (!scanner.detector && window.ZXing) {
    const Z = window.ZXing; const hints = new Map();
    hints.set(Z.DecodeHintType.POSSIBLE_FORMATS, [Z.BarcodeFormat.EAN_13, Z.BarcodeFormat.EAN_8, Z.BarcodeFormat.UPC_A, Z.BarcodeFormat.CODE_128, Z.BarcodeFormat.CODE_39, Z.BarcodeFormat.ITF]);
    hints.set(Z.DecodeHintType.TRY_HARDER, true);
    scanner.zx = new Z.MultiFormatReader(); scanner.zx.setHints(hints); scanner.zxHints = hints;
  }
  return scanner.detector;
}
/* sx..sh: 원본에서 잘라 읽을 부분 (노란 선 둘레만 읽어서 빠르고 정확하게) */
function zxDecode(source, sx, sy, sw, sh, w, h){
  const Z = window.ZXing; const c = scanner.canvas || (scanner.canvas = document.createElement('canvas'));
  c.width = w; c.height = h; const ctx = c.getContext('2d', {willReadFrequently:true}); ctx.drawImage(source, sx, sy, sw, sh, 0, 0, w, h);
  try { const r = scanner.zx.decode(new Z.BinaryBitmap(new Z.HybridBinarizer(new Z.HTMLCanvasElementLuminanceSource(c))), scanner.zxHints); return r ? r.getText() : ''; }
  catch(e){ return ''; }
}
function gotCode(code){
  const now = Date.now();
  if (code === scanner.lastCode && now - scanner.lastSeen < 900) { scanner.lastSeen = now; return; } // 같은 바코드가 계속 비치는 중이면 한 번만
  scanner.lastCode = code; scanner.lastSeen = now;
  if (scanner.paused || !$('#sheet').hidden) return;
  scanner.paused = true; (scanner.mode === 'lookup' ? lookupScan(code) : onScan(code)).finally(() => setTimeout(() => { scanner.paused = !$('#sheet').hidden; }, 500));
}
const streamAlive = () => !!(scanner.stream && scanner.stream.getVideoTracks().some(t => t.readyState === 'live'));
/* 카메라는 한 번만 켜고 계속 다시 써요 → 권한 창이 매번 뜨지 않게 */
async function getStream(){
  if (streamAlive()) return scanner.stream;
  const stream = await navigator.mediaDevices.getUserMedia({audio:false, video:{facingMode:{ideal:'environment'}, width:{ideal:1280}, height:{ideal:720}}});
  scanner.stream = stream; scanner.torchOn = false;
  const track = stream.getVideoTracks()[0];
  try {
    const caps = track.getCapabilities ? track.getCapabilities() : {};
    if (caps.focusMode && caps.focusMode.includes('continuous')) await track.applyConstraints({advanced:[{focusMode:'continuous'}]});
    $('#torchBtn').hidden = !caps.torch;
  } catch(e){ $('#torchBtn').hidden = true; }
  track.addEventListener('ended', () => { if (scanner.stream === stream) scanner.stream = null; });
  return stream;
}
function releaseStream(){
  clearTimeout(scanner.idleT);
  if (scanner.stream) { scanner.stream.getTracks().forEach(t => t.stop()); scanner.stream = null; }
  scanner.torchOn = false; const v = $('#video'); if (v) v.srcObject = null;
}
async function setTorch(on){
  const track = scanner.stream && scanner.stream.getVideoTracks()[0]; if (!track) return;
  try { await track.applyConstraints({advanced:[{torch:on}]}); scanner.torchOn = on; } catch(e){ scanner.torchOn = false; }
  $('#torchBtn').setAttribute('aria-pressed', scanner.torchOn ? 'true' : 'false');
}
function cameraHelp(e){
  const denied = e && (e.name === 'NotAllowedError' || e.name === 'SecurityError');
  if (inAppsScript()) return ['구글 Apps Script 화면 안에서는 폰이 실시간 카메라를 막아요.', '폰에서는 따로 받은 ‘작업자용 링크’로 열어 주세요. 그 주소에서는 바코드를 비추기만 해도 담겨요.'];
  if (denied) return ['카메라 권한이 꺼져 있어요.', '주소창 왼쪽 자물쇠(또는 설정) → 권한 → 카메라 → 허용으로 바꾼 뒤 다시 눌러 주세요. 한 번 허용하면 다음부터는 묻지 않아요.'];
  return ['이 화면에서는 실시간 카메라를 쓸 수 없어요.', '폰의 크롬·사파리에서 작업자용 링크로 열면 비추기만 해도 담겨요.'];
}
async function lookupScan(bc){
  const hit = store.codes[bc]; const box = $('#scanMini');
  scanStatus('', '재고 확인 중…');
  if (store.mode !== 'sheet') { beep(false); scanStatus('bad', '✕ 구글 시트에 연결해야 재고를 볼 수 있어요'); return; }
  try {
    const r = await gsCall('stockFind', {q: hit ? hit.c : bc, limit:5});
    const list = r.rows || [];
    const row = (hit ? list.find(x => x.code === hit.c) : list.find(x => x.bc === bc)) || list[0];
    if (!row) { beep(false); scanStatus('bad', `✕ 재고표에 없는 바코드예요 · ${bc}`); return; }
    beep(true); scanStatus('ok', `✓ ${row.name || row.code}`);
    box.dataset.filled = '1';
    box.innerHTML = `<span class="l ${row.loc ? '' : 'none'}">${esc(row.loc || '위치 없음')}</span><span class="n">${esc(row.name || row.code)}<small>${esc(row.code)}${row.spec ? ' · 박스 ' + esc(row.spec) : ''}</small></span><span class="q">${esc(row.qty)}개</span>`;
    ui.stockQ = row.code; ui.stockRows = [row];
  } catch(e){ beep(false); scanStatus('bad', '✕ 재고를 불러오지 못했어요'); }
}
async function openScanner(mode){
  scanner.mode = mode === 'lookup' ? 'lookup' : 'pick';
  if (scanner.mode === 'pick' && (!curSlip() || ui.cur < 0)) return;
  clearTimeout(scanner.idleT);
  $('#scanner').hidden = false; $('#photoBox').hidden = true; $('#aim').hidden = false;
  delete $('#scanMini').dataset.filled; renderMini();
  $('#scanHint').textContent = scanner.mode === 'lookup' ? '재고를 볼 바코드를 비추세요' : '바코드를 노란 선에 비추세요';
  scanStatus('', scanner.mode === 'lookup' ? '비추면 재고 수량과 위치를 보여드려요.' : '비추기만 하면 자동으로 담겨요. 찍는 버튼은 없어요.');
  const v = $('#video');
  try {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) throw new Error('no-media');
    const stream = await getStream();
    if ($('#scanner').hidden) return;
    if (v.srcObject !== stream) v.srcObject = stream;
    v.hidden = false; await v.play();
    await makeDetector();
    if (!scanner.detector && !scanner.zx) throw new Error('no-decoder');
    scanner.lastCode = ''; scanner.running = true; scanner.paused = false; loop();
  } catch(e){
    v.hidden = true; $('#aim').hidden = true; $('#photoBox').hidden = false; $('#torchBtn').hidden = true;
    const [msg, help] = cameraHelp(e); $('#photoMsg').textContent = msg; $('#photoHelp').textContent = help;
    $('#scanHint').textContent = '실시간 카메라 사용 불가';
    scanStatus('', '급할 때는 아래 ‘임시로 사진 찍어 읽기’를 쓸 수 있어요.');
  }
}
function loop(){
  if (!scanner.running) return;
  const v = $('#video');
  const next = () => setTimeout(loop, scanner.detector ? 100 : 150);
  if (scanner.paused || v.readyState < 2 || !v.videoWidth) return next();
  if (scanner.detector) {
    scanner.detector.detect(v).then(cs => { if (cs && cs.length) gotCode(cs[0].rawValue); }).catch(() => {}).finally(next);
  } else {
    const vw = v.videoWidth, vh = v.videoHeight;
    const sy = Math.round(vh * 0.25), sh = Math.round(vh * 0.5); // 가운데 띠만
    const sc = Math.min(1, 1000 / vw);
    const code = zxDecode(v, 0, sy, vw, sh, Math.round(vw * sc), Math.round(sh * sc)); if (code) gotCode(code); next();
  }
}
function closeScanner(){
  scanner.running = false;
  if (scanner.torchOn) setTorch(false);
  const v = $('#video'); try { v.pause(); } catch(e){}
  $('#scanner').hidden = true; render();
  clearTimeout(scanner.idleT); scanner.idleT = setTimeout(releaseStream, 3 * 60000); // 3분 안에 다시 열면 권한 없이 바로 켜져요
}
document.addEventListener('visibilitychange', () => { if (document.hidden && $('#scanner').hidden) releaseStream(); });
async function decodePhoto(file){
  scanStatus('', '읽는 중…');
  try {
    await makeDetector();
    const url = URL.createObjectURL(file); const img = new Image(); img.src = url; await img.decode();
    let code = '';
    if (scanner.detector) { const cs = await scanner.detector.detect(img); code = cs && cs[0] ? cs[0].rawValue : ''; }
    if (!code && scanner.zx) { const sc = Math.min(1, 1600 / Math.max(img.naturalWidth, img.naturalHeight)); code = zxDecode(img, 0, 0, img.naturalWidth, img.naturalHeight, Math.round(img.naturalWidth * sc), Math.round(img.naturalHeight * sc)); }
    URL.revokeObjectURL(url);
    if (!code) { beep(false); scanStatus('bad', '✕ 바코드를 찾지 못했어요. 더 가까이, 흔들리지 않게 다시 찍어 주세요.'); return; }
    if (scanner.mode === 'lookup') { await lookupScan(code); return; }
    await onScan(code); renderMini();
  } catch(e){ scanStatus('bad', '✕ 사진을 읽지 못했어요. 다시 찍어 주세요.'); }
}

/* bluetooth / USB scanners type fast and press Enter */
let kbBuf = '', kbAt = 0;
document.addEventListener('keydown', e => {
  const t = e.target; if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.isContentEditable)) return;
  const now = Date.now(); if (now - kbAt > 80) kbBuf = ''; kbAt = now;
  if (e.key === 'Enter') { if (kbBuf.length >= 6) { e.preventDefault(); const c = kbBuf; kbBuf = ''; if ($('#sheet').hidden) onScan(c); } kbBuf = ''; return; }
  if (e.key.length === 1 && /[0-9A-Za-z\-]/.test(e.key)) kbBuf += e.key;
});

/* ---------- files ---------- */
$('#fileSlip').onchange = async e => {
  const files = [...e.target.files]; e.target.value = ''; if (!files.length) return;
  const perFile = []; let bad = 0; zeroLines = 0;
  for (const f of files) {
    try { const got = parseSlips(await readFile(f), f.name); if (got.length) perFile.push({name: f.name, slips: got}); else bad++; }
    catch(err){ bad++; }
  }
  const slips = perFile.flatMap(x => x.slips);
  if (!slips.length) { ask({title:'전표를 찾지 못했어요', body:'제목 줄에 ‘품목코드’, ‘품목명’, ‘수량’이 있는 창고이동 전표 엑셀인지 확인해 주세요.'}); return; }
  const dup = slips.filter(s => store.slips[s.id]);
  let replaceDup = false;
  if (dup.length) {
    const started = dup.filter(s => store.progress[s.id] && store.progress[s.id].status).length;
    const v = await ask({title:`이미 올린 전표 ${dup.length}장이 들어 있어요`,
      body:`${dup.slice(0, 5).map(s => `<span class="mono">${esc(s.no)}</span>`).join(', ')}${dup.length > 5 ? ` 외 ${dup.length - 5}장` : ''}<br>${started ? `이 중 ${started}장은 피킹 기록이 있어요. 새 파일로 바꾸면 그 기록이 지워져요.` : '새 파일 내용으로 바꿀지 골라 주세요.'}`,
      actions: slips.length > dup.length
        ? [{label:`새로운 전표 ${slips.length - dup.length}장만 올리기`, value:'skip', kind:'primary'}, {label:'겹치는 전표도 새 파일로 바꾸기', value:'replace'}, {label:'취소', value:null}]
        : [{label:'그대로 두기', value:null, kind:'primary'}, {label:'새 파일 내용으로 바꾸기', value:'replace'}]});
    if (!v) return;
    replaceDup = v === 'replace';
  }
  // 폴더 정하기: 전표가 여러 장 든 파일 → 새 폴더 자동 생성 / 한 장짜리 → 지금 열어둔 폴더
  const now = new Date(); const stamp = `${pad(now.getMonth() + 1)}/${pad(now.getDate())} ${pad(now.getHours())}:${pad(now.getMinutes())}`;
  const batches = []; let total = 0; const made = [];
  perFile.forEach((pf, fi) => {
    const todo = pf.slips.filter(s => !store.slips[s.id] || replaceDup);
    if (!todo.length) return;
    let folder = null;
    if (pf.slips.length > 1) {
      const need = todo.filter(s => !(store.slips[s.id] && folderOf(store.slips[s.id])));
      const dests = [...new Set(need.map(s => s.to).filter(Boolean))];
      const label = dests.length === 1 ? dests[0] : '통합';
      if (need.length) folder = {id: newFolderId() + fi, name: `${label} ${stamp} ${need.length}장`, createdAt: Date.now(), by: worker()};
    }
    const items = todo.map(s => {
      const old = store.slips[s.id];
      const keep = old && folderOf(old);
      const slip = {...s, folder: keep || (folder ? folder.id : (ui.folder || '')), urgent: old ? !!old.urgent : false};
      return {slip, replace: !!old};
    });
    total += items.length; if (folder) made.push(folder);
    batches.push({items, folder});
  });
  if (!total) { toast('새로 올릴 전표가 없어요'); return; }
  if (total > 1) toast(`전표 ${total}장 올리는 중…`);
  for (const b of batches) await putSlips(b.items, b.folder);
  const newCodes = {};
  batches.forEach(b => b.items.forEach(({slip}) => slip.lines.forEach(l => {
    if (l.bc && /^[0-9]{6,14}$/.test(l.bc) && !store.codes[l.bc] && !newCodes[l.bc]) newCodes[l.bc] = {c: l.code, n: l.name, w: worker(), t: Date.now()};
  })));
  if (Object.keys(newCodes).length) addCodes(newCodes);
  const all = batches.flatMap(b => b.items.map(x => x.slip));
  const lines = all.reduce((a, s) => a + s.lines.length, 0);
  if (made.length === 1 && batches.length === 1) openFolder(made[0].id);
  if (total > 1) ask({title:`전표 ${total}장을 올렸어요`,
    body:`${made.length ? `${made.map(m => `‘${esc(m.name)}’`).join(', ')} 폴더를 만들어 전표별로 나눠 넣었어요. 폴더 이름은 폴더 안 ‘이름 바꾸기’로 바꿀 수 있어요.` : '전표별로 나눠 등록했어요.'}<br>품목 ${lines}줄.${zeroLines ? `<br>수량이 0인 줄 ${zeroLines}개는 피킹할 게 없어서 뺐어요.` : ''}${bad ? `<br>읽지 못한 파일 ${bad}개가 있어요.` : ''}`,
    html:`<div class="list">${all.slice(0, 12).map(s => `<div class="li" style="grid-template-columns:1fr auto"><span class="n"><b class="mono">${esc(s.no)}</b><small>${esc(s.to || s.from || '')}</small></span><span class="q">${s.lines.length}품목</span></div>`).join('')}</div>${all.length > 12 ? `<p>외 ${all.length - 12}장</p>` : ''}`});
  else toast(`전표 1장을 올렸어요${ui.folder && store.folders[ui.folder] ? ` · ‘${store.folders[ui.folder].name}’ 폴더` : ''}${bad ? ` · 읽지 못한 파일 ${bad}개` : ''}`);
};
$('#fileCodes').onchange = async e => {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  try {
    const {map, skipped} = parseCodeBook(await readFile(f)); const n = Object.keys(map).length;
    if (!n) { ask({title:'바코드를 찾지 못했어요', body:'제목 줄에 ‘품목코드’와 ‘바코드’ 글자가 있는지 확인해 주세요.'}); return; }
    await addCodes(map);
    ask({title:`바코드 ${n}개를 등록했어요`, body: skipped ? `${skipped}개는 엑셀에서 숫자가 ‘8.8E+12’처럼 줄여져 있어 건너뛰었어요. 바코드 열을 텍스트 형식으로 바꿔 다시 올려 주세요.` : '이제 피킹할 때 바로 확인돼요.'});
  } catch(err){ ask({title:'파일을 열지 못했어요', body:'엑셀(.xlsx) 파일인지 확인해 주세요.'}); }
};
$('#fileStock').onchange = async e => {
  const f = e.target.files[0]; e.target.value = ''; if (!f) return;
  if (store.mode !== 'sheet') { ask({title:'구글 시트 연결이 필요해요', body:'재고는 구글 시트에 저장돼요. 연결한 뒤 다시 올려 주세요.'}); return; }
  let parsed;
  try { parsed = parseStock(await readFile(f)); }
  catch(err){ ask({title:'파일을 열지 못했어요', body:'재고현황 엑셀(.xlsx)인지 확인해 주세요.'}); return; }
  if (!parsed.rows.length) { ask({title:'재고를 찾지 못했어요', body:'제목 줄에 ‘품목코드’와 ‘재고수량’이 있는 재고현황 파일인지 확인해 주세요.'}); return; }
  const total = parsed.rows.length;
  const ok = await ask({title:`재고 ${total.toLocaleString()}개 품목을 올릴까요?`,
    body:`기준 ${esc(parsed.meta.at || '-')}${parsed.meta.wh ? ' · ' + esc(parsed.meta.wh) : ''}<br>지금 저장된 재고는 이 파일 내용으로 바뀌고, 파일 안의 바코드도 함께 등록돼요.<br>1~2분 걸릴 수 있어요.`,
    actions:[{label:'올리기', value:true, kind:'primary'}, {label:'취소', value:false}]});
  if (!ok) return;
  const CH = 1200;
  try {
    for (let i = 0; i < total; i += CH){
      toast(`재고 올리는 중… ${Math.min(i + CH, total).toLocaleString()} / ${total.toLocaleString()}`);
      await gsWrite('putStock', {rows: parsed.rows.slice(i, i + CH), replace: i === 0, meta: parsed.meta});
    }
    toast('전표의 재고 수량을 맞추는 중…');
    await gsWrite('refreshStock', {});
  } catch(err){ ask({title:'올리는 중 문제가 있었어요', body:'인터넷 연결을 확인하고 다시 올려 주세요.'}); return; }
  GS.ver = ''; GS.codesVer = ''; gsSoon(100);
  ask({title:`재고 ${total.toLocaleString()}개를 올렸어요`,
    body:`파일 안의 바코드가 등록됐고, 이미 올려둔 전표의 전산 재고도 새로 맞췄어요.${parsed.skipped ? `<br>바코드 모양이 이상한 ${parsed.skipped}건은 건너뛰었어요.` : ''}`});
};
$('#filePhoto').onchange = e => { const f = e.target.files[0]; e.target.value = ''; if (f) decodePhoto(f); };
$('#shootBtn').onclick = () => $('#filePhoto').click();
$('#scanClose').onclick = closeScanner;

async function saveFile(name, buf){
  let dl = null;
  if (window.claude && typeof window.claude.use === 'function') { try { dl = await window.claude.use('downloads'); } catch(e){ dl = null; } }
  if (dl) {
    try { await dl.save({filename:name, data:new Blob([buf])}); toast('파일을 저장했어요'); }
    catch(e){ if (e && e.code === 'declined') return; toast('파일을 저장하지 못했어요'); }
    return;
  }
  const url = URL.createObjectURL(new Blob([buf], {type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'}));
  const a = document.createElement('a'); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 4000);
}
function exportResult(id){
  const slip = store.slips[id], prog = store.progress[id] || {};
  const label = {done:'완료', short:'부족', '':'미확인'};
  const lines = [...slip.lines].sort((a, b) => coll.compare(String(a.seq), String(b.seq)));
  const aoa = [['창고이동 피킹 결과'], ['전표번호', slip.no], ['출고창고', slip.from], ['입고창고', slip.to], ['작업자', prog.worker || ''], ['시작', fmtFull(prog.startedAt)], ['완료', fmtFull(prog.finishedAt)], [],
    ['순번', '로케이션', '품목코드', '품목명', '요청수량', '피킹수량', '상태', '사유', '확인방법', '확인시각']];
  lines.forEach(l => { const i = info(slip, prog, l.k); const pl = (prog.lines && prog.lines[l.k]) || {};
    aoa.push([l.seq, l.loc, l.code, l.name, l.qty, i.p, label[i.s], i.r, pl.v === 'manual' ? '수동' : pl.v === 'scan' ? '바코드' : '', fmtFull(pl.t)]); });
  const ws = XLSX.utils.aoa_to_sheet(aoa); ws['!cols'] = [6, 12, 18, 36, 9, 9, 8, 12, 9, 17].map(w => ({wch:w}));
  const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, '피킹결과');
  saveFile(`피킹결과_${slip.no}.xlsx`, XLSX.write(wb, {bookType:'xlsx', type:'array'}));
}
function exportCodes(){
  const rows = [['품목코드', '품목명', '바코드']];
  Object.entries(store.codes).filter(([, v]) => v).sort((a, b) => coll.compare(a[1].c, b[1].c)).forEach(([bc, v]) => rows.push([v.c, v.n || '', bc]));
  if (rows.length === 1) { toast('아직 등록된 바코드가 없어요'); return; }
  const ws = XLSX.utils.aoa_to_sheet(rows); ws['!cols'] = [{wch:18}, {wch:36}, {wch:16}];
  rows.forEach((r, i) => { if (i) { const c = ws[XLSX.utils.encode_cell({r:i, c:2})]; if (c) { c.t = 's'; c.z = '@'; } } });
  const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, '바코드대응표');
  saveFile('바코드대응표.xlsx', XLSX.write(wb, {bookType:'xlsx', type:'array'}));
}
